      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); annRedo(); }
      if (e.key === '+' || e.key === '=') { e.preventDefault(); annZoomIn(); }
      if (e.key === '-' || e.key === '_') { e.preventDefault(); annZoomOut(); }
      if (e.key === '0') { e.preventDefault(); annZoomReset(); }
    });
  })();

  // ---------- ZOOM ----------
  // Tingkat zoom disimpan sebagai skala terhadap ukuran piksel ASLI foto
  // (1 = 100%), bukan relatif terhadap "fit", supaya tombol Fit dan +/- selalu
  // konsisten berapa pun ukuran jendela browser.
  function annApplyZoom() {
    if (!annCur) return;
    const cv = document.getElementById('annCanvas');
    cv.style.width = Math.round(annCur.W * annCur.zoom) + 'px';
    cv.style.height = Math.round(annCur.H * annCur.zoom) + 'px';
    const stage = document.querySelector('.ann-stage');
    stage.classList.toggle('zoomed', annCur.zoom > annCur.fitZoom + 0.001);
    const zEl = document.getElementById('annZoomVal');
    if (zEl) zEl.textContent = Math.round(annCur.zoom * 100) + '%';
  }
  // Zoom sambil menjaga TITIK ACUAN (posisi kursor untuk Ctrl+Scroll, atau
  // tengah layar untuk tombol +/-/Fit) tetap di tempat yang sama -- seperti
  // Google Maps atau Figma. Sebelumnya zoom cuma mengubah ukuran kanvas tanpa
  // mengoreksi posisi scroll, jadi terasa seperti "ditarik" dari pojok
  // kiri-atas setiap kali diperbesar/diperkecil.
  function annZoomTo(newZoom, clientX, clientY) {
    if (!annCur) return;
    if (annCur.textEditing) return;  // lihat catatan di initAnnCanvas soal kenapa
    newZoom = Math.min(6, Math.max(0.1, newZoom));
    if (Math.abs(newZoom - annCur.zoom) < 0.0001) return;
    const stage = document.querySelector('.ann-stage');
    const cv = document.getElementById('annCanvas');
    const stageRect = stage.getBoundingClientRect();
    const px = (clientX != null) ? clientX : stageRect.left + stageRect.width / 2;
    const py = (clientY != null) ? clientY : stageRect.top + stageRect.height / 2;
    const cvRectBefore = cv.getBoundingClientRect();
    // Posisi titik acuan DI DALAM foto, sebagai pecahan 0..1 relatif terhadap
    // ukuran kanvas SAAT INI -- nilai ini tidak berubah walau zoom berganti.
    const fracX = cvRectBefore.width  ? (px - cvRectBefore.left) / cvRectBefore.width  : 0.5;
    const fracY = cvRectBefore.height ? (py - cvRectBefore.top)  / cvRectBefore.height : 0.5;

    annCur.zoom = newZoom;
    annApplyZoom();

    // Geser scroll supaya titik yang sama di dalam foto tetap berada persis
    // di posisi layar (px, py) semula -- bukan diam di pojok kiri-atas.
    const cvRectAfter = cv.getBoundingClientRect();
    const curScreenX = cvRectAfter.left + fracX * cvRectAfter.width;
    const curScreenY = cvRectAfter.top + fracY * cvRectAfter.height;
    stage.scrollLeft += Math.round(curScreenX - px);
    stage.scrollTop  += Math.round(curScreenY - py);
  }
  function annZoomIn() {
    if (!annCur) return;
    annZoomTo(annCur.zoom * 1.25);
  }
  function annZoomOut() {
    if (!annCur) return;
    annZoomTo(annCur.zoom / 1.25);
  }
  function annZoomReset() {
    if (!annCur) return;
    annZoomTo(annCur.fitZoom);
  }

  // ---------- CROP ----------
  // Batalkan pilihan area crop yang sedang dibuat (belum diterapkan).
  function annCropCancel() {
    if (!annCur) return;
    annCur.cropRect = null;
    annCur.cropDrag = null;
    const btn = document.getElementById('annCropApply');
    if (btn) btn.disabled = true;
    annDraw();
  }
  // Terapkan crop: potong annCur.img ke area yang dipilih, remap koordinat
  // anotasi yang sudah ada supaya tetap menempel di objek yang sama, lalu
  // sesuaikan ulang kanvas & zoom ke dimensi barunya. Hasil crop baru benar-
  // benar tersimpan ke foto saat tombol "Simpan Anotasi" ditekan (lihat annSave).
  function annApplyCrop() {
    if (!annCur || !annCur.cropRect) return;
    const r = annCur.cropRect;
    const x1 = Math.min(r.x1, r.x2), x2 = Math.max(r.x1, r.x2);
    const y1 = Math.min(r.y1, r.y2), y2 = Math.max(r.y1, r.y2);
    const W = annCur.W, H = annCur.H;
    const sx = Math.round(x1 * W), sy = Math.round(y1 * H);
    const sw = Math.max(1, Math.round((x2 - x1) * W));
    const sh = Math.max(1, Math.round((y2 - y1) * H));
    // Simpan dulu keadaan SEBELUM crop -- inilah yang dipakai kalau aksi crop
    // ini di-undo lewat tombol Undo / Ctrl+Z (bukan cuma "Batal Pilih" yang
    // membatalkan pilihan area sebelum diterapkan).
    const before = {
      img: annCur.img, W: annCur.W, H: annCur.H,
      ann: annCur.ann.map(a => Object.assign({}, a)),
      cropApplied: annCur.cropApplied
    };
    const c = document.createElement('canvas');
    c.width = sw; c.height = sh;
    c.getContext('2d').drawImage(annCur.img, sx, sy, sw, sh, 0, 0, sw, sh);

    // Anotasi yang sudah ada dipindah koordinatnya ke sistem gambar baru
    // (yang lebih kecil), supaya tetap menempel di objek yang sama.
    const remap = (nx, ny) => [(nx * W - sx) / sw, (ny * H - sy) / sh];
    const remappedAnn = annCur.ann.map(a => {
      const b = Object.assign({}, a);
      [b.x1, b.y1] = remap(a.x1, a.y1);
      if (a.x2 != null) [b.x2, b.y2] = remap(a.x2, a.y2);
      if (a.pts) b.pts = a.pts.map(([px, py]) => remap(px, py));
      if (a.boxW != null) b.boxW = a.boxW * (W / sw);  // lebar kotak teks ikut skala baru
      return b;
    });

    const newImg = new Image();
    newImg.onload = () => {
      annCur.img = newImg;
      annCur.W = sw; annCur.H = sh;
      annCur.ann = remappedAnn;
      annCur.cropRect = null; annCur.cropDrag = null;
      annCur.cropApplied = true;
      const after = {
        img: newImg, W: sw, H: sh,
        ann: remappedAnn.map(a => Object.assign({}, a)),
        cropApplied: true
      };
      annPushAction({ type: 'crop', before, after });
      const cv = document.getElementById('annCanvas');
      cv.width = sw; cv.height = sh;
      const stage = document.querySelector('.ann-stage');
      const maxW = stage.clientWidth - 32;
      const maxH = stage.clientHeight - 32;
      const sc = Math.min(maxW / sw, maxH / sh, 1);
      annCur.fitZoom = sc;
      annCur.zoom = sc;
      annApplyZoom();
      annSetTool('arrow');
      const btn = document.getElementById('annCropApply');
      if (btn) btn.disabled = true;
      annDraw();
      showToast('success', 'Crop diterapkan', 'Foto sudah dipotong. Kalau keliru, tinggal klik Undo.', 3500);
    };
    newImg.src = c.toDataURL('image/jpeg', 0.95);
  }

  // Putar koordinat anotasi mengikuti rotasi foto, supaya penanda tetap
  // menempel di objek yang sama walau fotonya diputar setelah dianotasi.
  function annRotatePoint(x, y, deg) {
    if (deg === 90)  return [1 - y, x];
    if (deg === 180) return [1 - x, 1 - y];
    if (deg === 270) return [y, 1 - x];
    return [x, y];
  }

  function annRotateAll(list, deg) {
    const d = ((deg % 360) + 360) % 360;
    if (!d || !list || !list.length) return list || [];
    return list.map(a => {
      const b = Object.assign({}, a);
      [b.x1, b.y1] = annRotatePoint(a.x1, a.y1, d);
      if (a.x2 != null) [b.x2, b.y2] = annRotatePoint(a.x2, a.y2, d);
      if (a.pts) b.pts = a.pts.map(([px, py]) => annRotatePoint(px, py, d));
      return b;
    });
  }

  // ================= EDITOR TEKS KAYA (RICH TEXT) =================
  // Menggantikan prompt() bawaan browser: kotak teks muncul TEPAT di titik
  // klik dan bisa diformat (tebal/miring/garis bawah/sorot/ukuran/perataan/
  // poin-poin) lewat toolbar mengambang, memakai contenteditable asli browser
  // supaya WYSIWYG saat mengetik. Begitu "Selesai" ditekan, isinya diuraikan
  // jadi model {blocks:[{align,bullet,runs:[...]}]} lalu "dibakar" ke kanvas
  // sendiri (annDrawRichText) -- BUKAN screenshot HTML -- supaya hasilnya
  // identik persis antara tampilan di editor, hasil Excel, dan saat dibuka
  // lagi untuk diedit ulang.
  let annTextEditIndex = null;   // index shape di annCur.ann yg sedang diedit, atau null kalau bikin baru

  // Cari shape richtext yang bounding box terakhirnya (_lastBox, diisi saat
  // render) memuat titik klik -- dari yang paling ATAS (paling akhir digambar)
  // supaya cocok dengan yang terlihat mata kalau ada tumpang tindih.
  function annTextHitTest(px, py) {
    for (let i = annCur.ann.length - 1; i >= 0; i--) {
      const a = annCur.ann[i];
      if ((a.t !== 'richtext' && a.t !== 'text') || !a._lastBox) continue;
      if (annHitTestShape(a, px, py, annCur.W, annCur.H)) return i;
    }
    return -1;
  }

  function annTextOpen(p) {
    if (!annCur) return;
    const hitIdx = annTextHitTest(p.x, p.y);
    annTextEditIndex = (hitIdx >= 0) ? hitIdx : null;

    const cv = document.getElementById('annCanvas');
    const cw = cv.clientWidth, ch = cv.clientHeight;
    const editor = document.getElementById('annTextEditor');
    const body = document.getElementById('annTextBody');

    let leftPx, topPx, widthPx;
    if (annTextEditIndex != null) {
      const shape = annCur.ann[annTextEditIndex];
      leftPx = shape.x1 * cw;
      topPx = shape.y1 * ch;
      if (shape.t === 'text') {
        const legacyText = document.createElement('span');
        legacyText.textContent = shape.txt || '';
        legacyText.style.color = shape.c || annCur.color || '#fff';
        legacyText.style.fontWeight = '700';
        legacyText.style.fontSize = Math.max(12, Math.round(cw * 0.032 * (shape.w || 2) / 2)) + 'px';
        body.replaceChildren(legacyText);
        widthPx = Math.max(90, (shape._lastBox.w || 0.22) * cw);
        annCur.curTextBoxColor = 'rgba(15,23,42,0.82)';
      } else {
        widthPx = Math.max(90, (shape.boxW || 0.22) * cw);
        body.innerHTML = annBlocksToHTML(shape.blocks, cw);
        // Data lama tanpa boxColor tetap memakai latar gelap; null berarti
        // latar sengaja dihapus.
        annCur.curTextBoxColor = (shape.boxColor === undefined) ? 'rgba(15,23,42,0.72)' : shape.boxColor;
      }
    } else {
      leftPx = p.x * cw;
      topPx = p.y * ch;
      widthPx = Math.max(160, cw * 0.22);
      body.innerHTML = '';
      // Kotak teks baru memakai latar gelap semi-transparan agar langsung terbaca.
      annCur.curTextBoxColor = 'rgba(15,23,42,0.82)';
    }

    widthPx = Math.min(cw, Math.max(Math.min(90, cw), widthPx));
    leftPx = Math.max(0, Math.min(leftPx, cw - widthPx));
    topPx = Math.max(0, Math.min(topPx, ch - 40));
    editor.style.left = Math.round(leftPx) + 'px';
    editor.style.top = Math.round(topPx) + 'px';
    body.style.width = Math.round(widthPx) + 'px';
    // Pratinjau kotak SELAMA mengetik mengikuti persis pilihan latar (atau
    // transparan kalau belum pilih apa-apa), dan warna teks default memakai
    // warna alat yang lagi aktif -- supaya tetap terbaca sambil mengetik,
    // bukan putih polos yang bisa hilang di foto yang terang.
    body.style.background = annCur.curTextBoxColor || 'transparent';
    body.style.color = annCur.color || '#fff';
    editor.style.display = 'block';
    annCur.textEditing = true;

    // Kalau kotak terlalu dekat ke tepi atas area yang sedang terlihat,
    // toolbar-nya dipindah ke BAWAH kotak supaya tidak terpotong/tersembunyi.
    const stage = document.querySelector('.ann-stage');
    editor.classList.toggle('flip-below', (topPx - stage.scrollTop) < 46);

    annDraw();

    setTimeout(() => {
      body.focus();
      const range = document.createRange();
      range.selectNodeContents(body);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      annTextUpdateToolbarState();
    }, 0);
  }

  // Dipanggil di awal berbagai aksi lain (ganti alat, undo/redo, buka foto
  // lain, simpan/batal seluruh modal, dst.) supaya teks yang sedang diketik
  // otomatis tersimpan dulu -- tidak hilang begitu saja tanpa disadari.
  function annTextCommitIfOpen() {
    if (annCur && annCur.textEditing) annTextCommit();
  }

  function annTextCommit() {
    if (!annCur || !annCur.textEditing) return;
    const body = document.getElementById('annTextBody');
    const editor = document.getElementById('annTextEditor');
    const cv = document.getElementById('annCanvas');
    const cw = cv.clientWidth || 1, ch = cv.clientHeight || 1;
    const wasEditing = annTextEditIndex;
    const plainText = (body.textContent || '').replace(/\u200B/g, '').trim();

    const closeEditorUI = () => {
      annTextEditIndex = null;
      annCur.textEditing = false;
      editor.style.display = 'none';
      body.innerHTML = '';
      const hlMenu = document.getElementById('annHlMenu');
      if (hlMenu) hlMenu.classList.remove('show');
    };

    if (!plainText) {
      // Kotak dikosongkan total -> anggap user memang mau menghapusnya.
      closeEditorUI();
      if (wasEditing != null) {
        const removedShape = Object.assign({}, annCur.ann[wasEditing]);
        annCur.ann.splice(wasEditing, 1);
        annPushAction({ type: 'removeShape', index: wasEditing, shape: removedShape });
      }
      annDraw();
      return;
    }

    const blocks = annParseEditorHTML(body, cw);
    const boxWFrac = Math.max(0.04, Math.min(0.95, (body.getBoundingClientRect().width || cw * 0.22) / cw));
    const shape = {
      t: 'richtext', c: annCur.color,
      x1: parseFloat(editor.style.left) / cw,
      y1: parseFloat(editor.style.top) / ch,
      boxW: boxWFrac,
      boxColor: annCur.curTextBoxColor,  // null = tanpa latar (default), atau warna terpilih
      blocks
    };

    if (wasEditing != null) {
      const before = annCur.ann[wasEditing];
      annCur.ann[wasEditing] = shape;
      annPushAction({ type: 'editShape', index: wasEditing, before, after: shape });
    } else {
      annCur.ann.push(shape);
      annPushAction({ type: 'shape', shape });
    }

    closeEditorUI();
    annDraw();
  }

  function annTextDiscard() {
    if (!annCur) return;
    annTextEditIndex = null;
    annCur.textEditing = false;
    const editor = document.getElementById('annTextEditor');
    const body = document.getElementById('annTextBody');
    if (editor) editor.style.display = 'none';
    if (body) body.innerHTML = '';
    const hlMenu = document.getElementById('annHlMenu');
    if (hlMenu) hlMenu.classList.remove('show');
    annDraw();
  }

  function annTextCmd(cmd) {
    const body = document.getElementById('annTextBody');
    body.focus();
    const sel = window.getSelection();
    // Beberapa perintah (terutama insertUnorderedList) suka "melempar" posisi
    // kursor ke AWAL baris setelah dijalankan, padahal user maunya lanjut
    // mengetik persis dari titik semula. Kalau sebelum perintah ini kursor
    // cuma berkedip (tidak sedang menyeleksi blok teks), kembalikan ke akhir
    // isi kotak sesudahnya -- cocok untuk alur paling umum: ketik lalu format.
    const wasCollapsed = !sel.rangeCount || sel.getRangeAt(0).collapsed;
    try { document.execCommand('styleWithCSS', false, true); } catch (e) { /* abaikan di browser lama */ }
    document.execCommand(cmd, false, null);
    if (wasCollapsed) {
      const range = document.createRange();
      range.selectNodeContents(body);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }
    annTextUpdateToolbarState();
  }

  function annTextToggleHlMenu() {
    const m = document.getElementById('annHlMenu');
    if (m) m.classList.toggle('show');
  }

  // ---------- LATAR KOTAK TEKS (opsional, default TANPA latar) ----------
  // Beda dengan Highlight (annTextSetHighlight) yang menyorot PER-KATA/PER-
  // KARAKTER yang diseleksi, ini mengatur warna latar untuk SELURUH kotak
  // teks sekaligus -- dan hanya dipakai saat menggambar hasil akhirnya ke
  // kanvas (annDrawRichText), bukan lewat document.execCommand.
  function annTextToggleBoxMenu() {
    const m = document.getElementById('annBoxBgMenu');
    if (m) m.classList.toggle('show');
  }
  function annTextSetBoxColor(color) {
    if (!annCur) return;
    annCur.curTextBoxColor = color;
    const body = document.getElementById('annTextBody');
    if (body) body.style.background = color || 'transparent';
    annTextToggleBoxMenu();
  }

  // Jangkauan yang dikenai perintah format (ukuran/sorot/warna). Kalau user
  // TIDAK sedang menyeleksi apa pun (kursor cuma berkedip di suatu tempat),
  // perintah dikenakan ke SELURUH ISI kotak -- lebih intuitif untuk label
  // anotasi yang pendek dibanding harus blok teks manual dulu.
  function annTextEffectiveRange() {
    const body = document.getElementById('annTextBody');
    const sel = window.getSelection();
    if (sel.rangeCount) {
      const r = sel.getRangeAt(0);
      if (!r.collapsed && body.contains(r.commonAncestorContainer)) return r;
    }
    const r2 = document.createRange();
    r2.selectNodeContents(body);
    return r2;
  }

  function annTextWrapSelection(styleProps) {
    const body = document.getElementById('annTextBody');
    body.focus();
    const range = annTextEffectiveRange();
    if (!range) return;
    const span = document.createElement('span');
    Object.keys(styleProps).forEach(k => { span.style[k] = styleProps[k]; });
    try {
      range.surroundContents(span);
    } catch (e) {
      // Seleksi memotong beberapa elemen sekaligus (tidak rapi satu simpul) --
      // pindahkan isinya ke span baru dengan cara yang lebih "kasar" tapi aman.
      const frag = range.extractContents();
      span.appendChild(frag);
      range.insertNode(span);
    }
    const sel = window.getSelection();
    sel.removeAllRanges();
    const nr = document.createRange();
    nr.selectNodeContents(span);
    sel.addRange(nr);
  }

  function annTextSetFontSize(px) {
    annTextWrapSelection({ fontSize: px + 'px' });
  }

  function annTextSetHighlight(color) {
    annTextWrapSelection({ backgroundColor: color || 'transparent' });
    annTextToggleHlMenu();
  }

  // Dipanggil dari annSetColor() saat editor teks sedang terbuka -- swatch
  // warna yang sama dipakai baik untuk warna alat gambar maupun warna teks,
  // supaya tidak perlu color-picker terpisah.
  function annTextSetColor(c) {
    annTextWrapSelection({ color: c });
  }

  function annTextUpdateToolbarState() {
    try {
      document.getElementById('annTB-bold').classList.toggle('active', document.queryCommandState('bold'));
      document.getElementById('annTB-italic').classList.toggle('active', document.queryCommandState('italic'));
      document.getElementById('annTB-underline').classList.toggle('active', document.queryCommandState('underline'));
      document.getElementById('annTB-bullet').classList.toggle('active', document.queryCommandState('insertUnorderedList'));
      document.getElementById('annTB-alignL').classList.toggle('active', document.queryCommandState('justifyLeft'));
      document.getElementById('annTB-alignC').classList.toggle('active', document.queryCommandState('justifyCenter'));
      document.getElementById('annTB-alignR').classList.toggle('active', document.queryCommandState('justifyRight'));
    } catch (e) { /* queryCommandState bisa melempar di beberapa kondisi -- abaikan */ }
  }

  // ---------- KONVERSI: model blocks/runs <-> HTML contenteditable ----------
  function annEscapeHTML(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function annRunToHTML(r, cw) {
    let text = annEscapeHTML(r.text || '').replace(/\n/g, '<br>');
    const styles = [];
    if (r.sizeFrac) styles.push(`font-size:${Math.round(r.sizeFrac * cw)}px`);
    if (r.color) styles.push(`color:${r.color}`);
    if (r.highlight) styles.push(`background-color:${r.highlight}`);
    let html = text;
    if (styles.length) html = `<span style="${styles.join(';')}">${html}</span>`;
    if (r.bold) html = `<b>${html}</b>`;
    if (r.italic) html = `<i>${html}</i>`;
    if (r.underline) html = `<u>${html}</u>`;
    return html;
  }
  function annBlocksToHTML(blocks, cw) {
    return (blocks || []).map(b => {
      const inner = (b.runs || []).map(r => annRunToHTML(r, cw)).join('') || '<br>';
      const styleAttr = ` style="text-align:${b.align || 'left'}"`;
      return b.bullet ? `<ul${styleAttr}><li>${inner}</li></ul>` : `<div${styleAttr}>${inner}</div>`;
    }).join('');
  }

  function annBlockAlign(el) {
    if (!el || !el.style) return 'left';
    const ta = el.style.textAlign;
    if (ta === 'center') return 'center';
    if (ta === 'right') return 'right';
    return 'left';
  }
  // Beda dengan annBlockAlign (yang selalu punya default 'left'), fungsi ini
  // mengembalikan null kalau elemen memang tidak punya text-align sendiri --
  // dipakai supaya perataan pada <li> boleh "mewarisi" punya <ul> induknya.
  function annOwnAlign(el) {
    if (!el || !el.style || !el.style.textAlign) return null;
    const ta = el.style.textAlign;
    return (ta === 'center' || ta === 'right') ? ta : 'left';
  }

  // Uraikan isi <div contenteditable> jadi paragraf (blocks), tiap paragraf
  // berisi potongan teks (runs) dengan gaya masing-masing. <br> dianggap
  // pemisah baris baru (paragraf baru) supaya perataan/bullet tetap benar
  // per baris. cw = lebar kanvas SAAT INI (px), dipakai untuk menormalkan
  // ukuran huruf jadi pecahan terhadap lebar gambar (sizeFrac).
  function annCollectBlocksFromChildren(nodeList, align, bullet, cw) {
    const blocks = [];
    let runs = [];
    const flush = () => { if (runs.length || blocks.length === 0) blocks.push({ align, bullet, runs }); runs = []; };
    function walk(node, style) {
      if (node.nodeType === 3) {
        if (node.nodeValue) runs.push(Object.assign({ text: node.nodeValue }, style));
        return;
      }
      if (node.nodeType !== 1) return;
      const tag = node.tagName;
      if (tag === 'BR') { flush(); return; }
      const s = Object.assign({}, style);
      if (tag === 'B' || tag === 'STRONG') s.bold = true;
      if (tag === 'I' || tag === 'EM') s.italic = true;
      if (tag === 'U') s.underline = true;
      const cs = node.style;
      if (cs) {
        const fw = cs.fontWeight;
        if (fw && (fw === 'bold' || fw === 'bolder' || parseInt(fw, 10) >= 600)) s.bold = true;
        if (cs.fontStyle === 'italic') s.italic = true;
        const td = cs.textDecorationLine || cs.textDecoration || '';
        if (td.indexOf('underline') !== -1) s.underline = true;
        if (cs.backgroundColor && cs.backgroundColor !== 'transparent' && cs.backgroundColor !== '') s.highlight = cs.backgroundColor;
        if (cs.fontSize) s.sizeFrac = parseFloat(cs.fontSize) / cw;
        if (cs.color) s.color = cs.color;
      }
      Array.from(node.childNodes).forEach(ch => walk(ch, s));
    }
    Array.from(nodeList).forEach(n => walk(n, {}));
    flush();
    return blocks;
  }

  function annParseEditorHTML(root, cw) {
    const rootAlign = annBlockAlign(root);
    let blocks = [];
    let pendingInline = [];
    const flushPending = () => {
      if (pendingInline.length) {
        blocks = blocks.concat(annCollectBlocksFromChildren(pendingInline, rootAlign, false, cw));
        pendingInline = [];
      }
    };
    Array.from(root.childNodes).forEach(node => {
      if (node.nodeType === 1 && (node.tagName === 'DIV' || node.tagName === 'P')) {
        flushPending();
        blocks = blocks.concat(annCollectBlocksFromChildren(node.childNodes, annBlockAlign(node), false, cw));
      } else if (node.nodeType === 1 && (node.tagName === 'UL' || node.tagName === 'OL')) {
        flushPending();
        const ulAlign = annOwnAlign(node) || rootAlign;
        Array.from(node.children).forEach(li => {
          blocks = blocks.concat(annCollectBlocksFromChildren(li.childNodes, annOwnAlign(li) || ulAlign, true, cw));
        });
      } else {
        pendingInline.push(node);
      }
    });
    flushPending();
    if (!blocks.length) blocks.push({ align: 'left', bullet: false, runs: [{ text: '' }] });
    return blocks;
  }

  // ---------- MENGGAMBAR TEKS KAYA KE KANVAS ----------
  function annFontString(style) {
    return `${style.italic ? 'italic ' : ''}${style.bold ? '700' : '400'} ${Math.round(style.fontPx)}px 'Segoe UI', Arial, sans-serif`;
  }
  function annRoundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function annDrawRichText(ctx, a, W, H) {
    const boxX = a.x1 * W;
    const boxY = a.y1 * H;
    const boxW = Math.max(30, (a.boxW || 0.22) * W);
    // a.boxColor === undefined -> anotasi LAMA dari sebelum fitur ini ada,
    // tetap dianggap pakai latar gelap seperti sedia kala supaya tampilannya
    // tidak berubah tiba-tiba. a.boxColor === null -> memang sengaja dipilih
    // Latar teks baru gelap semi-transparan; null tetap berarti tanpa latar.
    const bgColor = (a.boxColor === undefined) ? 'rgba(15, 23, 42, 0.72)' : a.boxColor;
    const hasBox = !!bgColor;
    // Tanpa kotak latar, tidak perlu jarak tepi selebar itu -- ruang teksnya
    // dibuat lebih lega karena tidak ada kotak yang membatasi secara visual.
    const padX = hasBox ? Math.max(5, boxW * 0.045) : Math.max(2, boxW * 0.018);
    const padY = padX;
    const innerW = boxW - padX * 2;

    ctx.save();
    ctx.textBaseline = 'alphabetic';

    // Pass 1: bungkus tiap blok jadi baris-baris (word-wrap), sekaligus
    // ukur lebar tiap kata memakai font ASLI-nya masing-masing.
    const lines = [];
    (a.blocks || []).forEach(block => {
      const bulletIndent = block.bullet ? Math.max(14, innerW * 0.07) : 0;
      const maxLineW = Math.max(10, innerW - bulletIndent);
      let curRuns = [], curW = 0, isFirst = true;
      const pushLine = () => {
        let maxSize = 0;
        curRuns.forEach(r => { maxSize = Math.max(maxSize, r.style.fontPx); });
        if (!maxSize) maxSize = Math.max(10, W * 0.028);
        lines.push({ align: block.align, bullet: block.bullet && isFirst, indent: bulletIndent, runs: curRuns, lineH: maxSize * 1.34 });
        curRuns = []; curW = 0; isFirst = false;
      };
      (block.runs || []).forEach(run => {
        const fontPx = Math.max(9, (run.sizeFrac || 0.032) * W);
        const style = {
          bold: !!run.bold, italic: !!run.italic, underline: !!run.underline,
          highlight: run.highlight || null, color: run.color || a.c || '#ffffff', fontPx
        };
        const parts = String(run.text || '').split('\n');
        parts.forEach((part, pi) => {
          if (pi > 0) pushLine();
          if (part === '') return;
          const words = part.split(/(\s+)/).filter(w => w.length);
          words.forEach(w => {
            ctx.font = annFontString(style);
            const ww = ctx.measureText(w).width;
            if (ww > maxLineW && w.trim() !== '') {
              Array.from(w).forEach(char => {
                const charW = ctx.measureText(char).width;
                if (curW + charW > maxLineW && curRuns.length > 0) pushLine();
                curRuns.push({ text: char, style, width: charW });
                curW += charW;
              });
              return;
            }
            if (curW + ww > maxLineW && curRuns.length > 0 && w.trim() !== '') pushLine();
            curRuns.push({ text: w, style, width: ww });
            curW += ww;
          });
        });
      });
      pushLine();
    });

    // Pass 2: hitung tinggi total, jaga kotak tetap di dalam batas foto
    // (persis seperti kotak teks sederhana sebelumnya), lalu gambar.
    let boxH = padY * 2;
    lines.forEach(l => { boxH += l.lineH; });
    const bx = Math.max(0, Math.min(boxX, W - boxW));
    const by = Math.max(0, Math.min(boxY, H - boxH));
    ctx.beginPath();
    ctx.rect(bx, by, boxW, boxH);
    ctx.clip();

    if (hasBox) {
      ctx.fillStyle = bgColor;
      annRoundRect(ctx, bx, by, boxW, boxH, Math.max(4, boxW * 0.025));
      ctx.fill();
    }

    // Halo (garis tepi kontras) untuk teks -- dipakai HANYA kalau kotak
    // tidak punya latar sama sekali, persis seperti teknik yang sudah dipakai
    // untuk panah/kotak/garis lain di annDrawShape, supaya teks tetap terbaca
    // baik di atas foto yang terang maupun gelap walau tanpa kotak latar.
    const drawHalo = (text, x, y, color) => {
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.miterLimit = 2;
      ctx.lineWidth = Math.max(2, ctx.measureText ? (parseFloat(ctx.font) || 16) * 0.16 : 3);
      ctx.strokeStyle = (color === '#ffffff') ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.8)';
      ctx.strokeText(text, x, y);
      ctx.restore();
    };

    let cy = by + padY;
    lines.forEach(line => {
      let lineWidth = line.indent;
      line.runs.forEach(r => { lineWidth += r.width; });
      let cx;
      if (line.align === 'center') cx = bx + padX + Math.max(0, (innerW - lineWidth) / 2);
      else if (line.align === 'right') cx = bx + padX + Math.max(0, innerW - lineWidth);
      else cx = bx + padX;

      if (line.indent) {
        if (line.bullet) {
          const dotColor = (line.runs[0] && line.runs[0].style.color) || a.c || '#ffffff';
          const dotR = Math.max(2, line.indent * 0.13);
          if (!hasBox) {
            // Cincin kontras tipis di belakang bulatan poin, sama seperti
            // halo pada teks -- supaya bulatannya tidak "menyatu" dengan
            // warna foto di baliknya.
            ctx.beginPath();
            ctx.fillStyle = (dotColor === '#ffffff') ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.8)';
            ctx.arc(cx + line.indent * 0.32, cy + line.lineH * 0.52, dotR + 1.2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.beginPath();
          ctx.fillStyle = hasBox ? '#fff' : dotColor;
          ctx.arc(cx + line.indent * 0.32, cy + line.lineH * 0.52, dotR, 0, Math.PI * 2);
          ctx.fill();
        }
        cx += line.indent;
      }

      line.runs.forEach(r => {
        ctx.font = annFontString(r.style);
        const baseline = cy + line.lineH * 0.76;
        if (r.style.highlight) {
          ctx.fillStyle = r.style.highlight;
          ctx.fillRect(cx, cy + line.lineH * 0.08, r.width, line.lineH * 0.8);
        }
        // Halo cuma perlu kalau TIDAK ada kotak latar DAN kata ini juga tidak
        // sedang disorot sendiri (sorot per-kata sudah otomatis memberi
        // kontras lewat fillRect di atas).
        if (!hasBox && !r.style.highlight) drawHalo(r.text, cx, baseline, r.style.color);
        ctx.fillStyle = r.style.color;
        ctx.fillText(r.text, cx, baseline);
        if (r.style.underline) {
          ctx.strokeStyle = r.style.color;
          ctx.lineWidth = Math.max(1, r.style.fontPx * 0.06);
          ctx.beginPath();
          ctx.moveTo(cx, baseline + r.style.fontPx * 0.09);
          ctx.lineTo(cx + r.width, baseline + r.style.fontPx * 0.09);
          ctx.stroke();
        }
        cx += r.width;
      });
      cy += line.lineH;
    });

    ctx.restore();

    // Simpan posisi terakhir (dalam pecahan 0..1) supaya klik berikutnya
    // dengan alat Teks bisa mendeteksi "ini mau diedit lagi", bukan bikin baru.
    a._lastBox = { x: bx / W, y: by / H, w: boxW / W, h: boxH / H };
  }

  // Pasang listener kotak teks & tombol seret-lebar sekali saja
  (function initAnnTextEditor() {
    const resize = document.getElementById('annTextResize');
    const editor = document.getElementById('annTextEditor');
    const body = document.getElementById('annTextBody');
    if (!resize || !editor || !body) return;
    let dragging = false, startX = 0, startW = 0;
    resize.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      dragging = true; startX = e.clientX; startW = body.getBoundingClientRect().width;
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const w = Math.max(90, startW + (e.clientX - startX));
      body.style.width = Math.round(w) + 'px';
    });
    window.addEventListener('mouseup', () => { dragging = false; });
    // CATATAN: sengaja TIDAK ada listener "klik di luar kotak = commit" di
    // sini. Semua jalur yang perlu menyimpan otomatis sudah ditangani masing-
    // masing di titik asalnya: annStart() (klik lain di kanvas), annSetTool()
    // (pindah alat), annSave()/annCancel() (tutup modal). Kalau pakai listener
    // global 'mousedown' di document, klik YANG SAMA yang baru saja membuka
    // kotak ini (event capture di kanvas lalu bubbling ke document) langsung
    // dianggap "klik di luar" dan menutup kotak yang baru sedetik dibuka.
  })();

  // ================= AUTO-SAVE DRAFT =================
  const DRAFT_KEY = 'qcPhotoInspection_draft_v1';
  let saveTimer = null;

  function setSaveStatus(msg, isWarn) {
    const el = document.getElementById('saveStatus');
    if (!el) return;
    el.textContent = msg;
    el.style.color = isWarn ? '#b45309' : '#94a3b8';
  }
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraft, 800);
  }
  const val = id => (document.getElementById(id) || {}).value || '';

  function collectState(includeImages) {
    const sheets = getSheets().map(sb => {
      const sid = sb.dataset.sid;
      const items = getItems(sid).map(card => {
        const id = card.dataset.id;
        const d = storeData[id] || {};
        const item = {
          finding: val(`finding-${id}`), corrective: val(`corrective-${id}`),
          area: val(`area-${id}`),
          inspector: val(`inspector-${id}`), pic: val(`pic-${id}`),
          finish: val(`finish-${id}`), level: val(`level-${id}`),
          // status "diubah manual" ikut disimpan supaya tidak tertimpa saat draft dipulihkan
          inspectorManual: (document.getElementById(`inspector-${id}`) || {}).dataset?.manual === '1',
          finishManual:    (document.getElementById(`finish-${id}`) || {}).dataset?.manual === '1'
        };
        // Anotasi selalu ikut disimpan: ukurannya cuma beberapa byte (vektor),
        // jadi tidak membebani kuota localStorage seperti foto.
        if ((d.beforeAnn || []).length) item.beforeAnn = d.beforeAnn;
        if ((d.afterAnn  || []).length) item.afterAnn  = d.afterAnn;
        if (d.beforeStamp) item.beforeStamp = d.beforeStamp;
        if (d.afterStamp) item.afterStamp = d.afterStamp;
        if (includeImages) {
          item.beforeOrig = d.beforeOrig || null; item.beforeRot = d.beforeRot || 0;
          item.afterOrig  = d.afterOrig  || null; item.afterRot  = d.afterRot  || 0;
        }
        return item;
      });
      return {
        name: val(`sname-${sid}`), project: val(`sproject-${sid}`),
        date: val(`sdate-${sid}`), type: val(`stype-${sid}`),
        sign1: val(`ssign1-${sid}`), sign2: val(`ssign2-${sid}`), items
      };
    });
    return { app: 'QC_PHOTO_INSPECTION', version: 1, savedAt: Date.now(), withImages: !!includeImages, quality: qualityIndex, sheets };
  }

  function saveDraft() {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(collectState(true)));
      setSaveStatus('✓ Draft tersimpan otomatis');
    } catch (err) {
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify(collectState(false)));
        setSaveStatus('⚠ Draft tersimpan tanpa foto (kuota browser penuh) — pakai "Simpan Draft ke File" agar foto ikut', true);
      } catch (e2) { setSaveStatus('⚠ Draft gagal disimpan', true); }
    }
  }
  document.addEventListener('input', e => {
    if (e.target.closest('#sheetsContainer')) scheduleSave();
  });

  function applyDraft(draft) {
    if (!draft) return false;
    if (typeof draft.quality === 'number') {
      qualityIndex = Math.min(QUALITY_PRESETS.length - 1, Math.max(0, draft.quality));
      document.getElementById('qualitySlider').value = qualityIndex;
      onQualityChange();
    }
    document.getElementById('sheetsContainer').innerHTML = '';
    Object.keys(storeData).forEach(k => delete storeData[k]);
    itemCount = 0; sheetCount = 0;
    if (typeof sheetSignatures !== 'undefined') Object.keys(sheetSignatures).forEach(k => delete sheetSignatures[k]);

    (draft.sheets || []).forEach(sh => {
      const sid = addSheet(
        { name: sh.name, project: sh.project, date: sh.date, type: sh.type,
          sign1: sh.sign1, sign2: sh.sign2 },
        { noItems: true, silent: true, keepActive: true }
      );
      (sh.items || []).forEach(it => {
        const id = addItem(sid, it, { silent: true });
        ['before', 'after'].forEach(side => {
          // Anotasi dipulihkan lebih dulu supaya ikut tergambar saat render
          storeData[id][side + 'Ann'] = it[side + 'Ann'] || [];
          storeData[id][side + 'Stamp'] = it[side + 'Stamp'] || null;
          joStampRefreshButton(id, side);
          const orig = it[side + 'Orig'];
          if (!orig) return;
          storeData[id][side + 'Orig'] = orig;
          storeData[id][side + 'Rot'] = it[side + 'Rot'] || 0;
          renderComposite(id, side);
        });
      });
      if (getItems(sid).length === 0) addItem(sid, {}, { silent: true });
    });

    if (!getSheets().length) addSheet();
    const first = getSheets()[0];
    activeSid = first ? first.dataset.sid : null;
    renumberSheets();
    return true;
  }

  function restoreDraft() {
    let draft;
    try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) { draft = null; }
    if (!applyDraft(draft)) return;
    hideDraftBanner();
    showToast('success', 'Draft dipulihkan',
      draft.withImages ? 'Isian dan foto sebelumnya sudah dikembalikan.'
                       : 'Isian teks dikembalikan. Foto tidak ikut tersimpan karena kuota browser.', 4500);
  }
  function discardDraft() {
    clearTimeout(saveTimer);
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    applyDraft({ sheets: [] });
    hideDraftBanner(); setSaveStatus('');
    showToast('info', 'Form baru dimulai', 'Isian dan foto dari form sebelumnya sudah dihapus.', 2500);
  }
  function hideDraftBanner() { document.getElementById('draftBanner').classList.remove('show'); }

  function checkDraftOnLoad() {
    let draft;
    try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) { return; }
    if (!draft || !draft.sheets) return;
    const total = draft.sheets.reduce((a, sh) => a + ((sh.items || []).length), 0);
    if (!total) return;
    const when = new Date(draft.savedAt || Date.now());
    const stamp = when.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    const photos = draft.sheets.reduce((a, sh) =>
      a + (sh.items || []).filter(i => i.beforeOrig || i.afterOrig).length, 0);
    document.getElementById('draftMsg').textContent =
      `Draft tersimpan ${stamp} — ${draft.sheets.length} sheet, ${total} temuan` +
      (draft.withImages ? ` (${photos} berisi foto).` : ' (teks saja, tanpa foto).');
    document.getElementById('draftBanner').classList.add('show');
  }

  function exportDraftFile() {
    try {
      const blob = new Blob([JSON.stringify(collectState(true))], { type: 'application/json' });
      const first = getSheets()[0];
      const nm = first ? (val(`sname-${first.dataset.sid}`) || 'Draft') : 'Draft';
      const dv = first ? val(`sdate-${first.dataset.sid}`) : '';
      const safe = String(nm).replace(/[\\/:*?"<>|]/g, '-').trim();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Draft_Inspection_List_${safe}${dv ? '_' + dv : ''}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      showToast('success', 'Draft disimpan', `File "${a.download}" (${(blob.size/1024/1024).toFixed(2)} MB) sudah didownload.`, 5000);
      return true;
    } catch (err) {
      showToast('error', 'Gagal menyimpan draft', (err && err.message) || '', 5000);
      return false;
    }
  }

  function importDraftFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      let draft;
      try { draft = JSON.parse(ev.target.result); }
      catch (err) { showToast('error', 'File tidak valid', 'Isi file bukan JSON yang bisa dibaca.', 4000); return; }
      if (!draft || draft.app !== 'QC_PHOTO_INSPECTION') {
        showToast('error', 'Bukan file draft', 'File ini bukan draft Photograph of Inspection List.', 4000);
        return;
      }
      const total = (draft.sheets || []).reduce((a, sh) => a + ((sh.items || []).length), 0);
      if (!confirm(`Muat draft ini? ${(draft.sheets || []).length} sheet, ${total} temuan.\n\nIsian yang sekarang akan diganti.`)) return;
      applyDraft(draft);
      hideDraftBanner(); scheduleSave();
      showToast('success', 'Draft dimuat', `${total} temuan berhasil dimuat dari file.`, 4000);
    };
    reader.onerror = () => showToast('error', 'Gagal membaca file', '', 3000);
    reader.readAsText(file);
  }

  // ================= PREVIEW LAYOUT CETAK =================
  // Catatan form dibuat DWIBAHASA: teks asli (Inggris) di blok atas, terjemahan

  // tidak terbiasa berbahasa Inggris tetap paham isinya.

    '1. Record each inspection finding (rebar, concrete, etc.) that does not comply, in both Bahasa Indonesia and English.\n' +

  const NOTES_TEXT_ID =

    '2. Foto temuan dan tindakan perbaikannya dari sudut pengambilan yang sama, lalu beri label sesuai nomor temuan.\n' +

  function fmtDate(v) {
    if (!v) return '';
    return new Date(v).toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function openPreview() {
    const sheets = getSheets();
    if (!getAllItems().length) { showToast('error', 'Belum ada temuan', '', 3000); return; }

    let html = '';
    sheets.forEach((sb, sIdx) => {
      const sid = sb.dataset.sid;
      const cards = getItems(sid);
      const sName = esc(val(`sname-${sid}`) || `Sheet ${sIdx + 1}`);
      const project = esc(val(`sproject-${sid}`));
      const insType = esc(val(`stype-${sid}`));
      const dateStr = fmtDate(val(`sdate-${sid}`)) || '-';
      const sign1 = esc(val(`ssign1-${sid}`) || 'PM');
      const sign2 = esc(val(`ssign2-${sid}`) || 'SM');
      const totalPages = Math.max(1, Math.ceil(cards.length / ITEMS_PER_PAGE));

  // ================= EXPORT EXCEL =================
  async function exportToExcel() {
    const empty = validateAll();
    if (empty.length) {
      showToast('error', 'Header belum lengkap', `Field wajib kosong: ${empty.join(', ')}.`, 6000);
      for (const sb of getSheets()) {
        const sid = sb.dataset.sid;
        const bad = SHEET_REQUIRED.find(f => document.getElementById(`fg-${f.key}-${sid}`).classList.contains('invalid'));
        if (bad) {
          switchSheet(sid);
          const el = document.getElementById(`${bad.key}-${sid}`);
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.focus();
          break;
        }
      }
      return;
    }

    const emptySheets = getSheets()
      .map((sb, i) => ({ i: i + 1, sid: sb.dataset.sid, n: getItems(sb.dataset.sid).length }))
      .filter(x => x.n === 0);
    if (emptySheets.length) {
      showToast('error', 'Ada sheet tanpa temuan', `Sheet #${emptySheets.map(x => x.i).join(', #')} masih kosong.`, 5000);
      switchSheet(emptySheets[0].sid);
      return;
    }

    showLoading('Menyiapkan file Excel...');
    try {
      const wb = new ExcelJS.Workbook();

      // Lebar kolom persis mengikuti form asli QP-006-02 (b): 17 kolom A-Q
      const colWidths = [3.42578125, 30, 13.28515625, 11.7109375, 10.7109375, 11.7109375,
                         4.5703125, 30, 10.28515625, 10.42578125, 9, 9.28515625, 9.28515625,
                         10.7109375, 5.5703125, 4.5703125, 12];
      const thin = { style: 'thin' };
      const colWidthToPx = w => Math.round(w * 7 + 5);
      const PT2PX = 96 / 72;

      // Tinggi baris disetel untuk cetak LANDSCAPE.
      //
      // Kenapa harus diturunkan: di landscape, fitToWidth menskalakan halaman ke
      // ~72.9% (bukan ~50.4% seperti portrait) karena lebar kertas lebih besar.
      // Skala yang lebih besar berarti tinggi hasil cetak juga lebih besar, padahal
      // tinggi kertas justru menyusut jadi 8.27in. Dengan tinggi baris lama,
      // 1 halaman = 10.95in x 0.729 = 7.98in, sedangkan area cetak cuma 7.47in
      // -- tumpah ke halaman berikutnya.
      //
      // Nilai di bawah sudah diverifikasi: 1 halaman = 9.83in x 0.729 = 7.16in,
      // masih ada sisa 0.31in. Ruang blok Notes = 30+30+74 = 134pt (~14.5 baris),
      // cukup untuk 12 baris dwibahasa @7pt plus cadangan kalau ada baris
      // panjang yang ter-wrap jadi dua.
      const H_TITLE1 = 30, H_TITLE3 = 74, H_ROW = 17.8, H_GAP = 22;

      // Tinggi baris FOOTER dipisah dari H_ROW dan dibuat lebih rapat.
      // Alasannya soal logo: lebarnya sudah mentok kolom B (213 dari 215px) dan
      // tidak boleh melebar ke kolom C, sedangkan bentuk logo sangat memanjang
      // (7.14:1) sehingga tingginya cuma 29.8px. Di baris setinggi 17.8pt
      // (kotak 47.5px) logo cuma mengisi 63% -- sisanya ruang kosong, itulah yang
      // membuatnya TERLIHAT gepeng padahal proporsinya tidak berubah sama sekali.
      // Dengan 13pt, kotak jadi 34.7px dan logo mengisi 86% -- terlihat pas.
      // Bonus: halaman jadi 0.09in lebih pendek, sisa ruang cetak bertambah.
      const H_FOOT = 13;
      const ITEM_ROWS = 14;   // tiap temuan memakai 14 baris
      const rowH = {};        // catatan tinggi tiap baris, dipakai untuk anchor foto

      const logoId = wb.addImage({ base64: currentLogoBase64, extension: 'png' });

      const usedNames = new Set();
      function safeSheetName(raw, idx) {
        let n = String(raw || '').replace(/[:\\\/?*\[\]]/g, '-').trim();
        if (!n) n = `Sheet ${idx + 1}`;
        if (n.length > 31) n = n.slice(0, 31);
        let final = n, k = 2;
        while (usedNames.has(final.toLowerCase())) {
          const suf = ` (${k++})`;
          final = n.slice(0, 31 - suf.length) + suf;
        }
        usedNames.add(final.toLowerCase());
        return final;
      }

      const sheetBlocks = getSheets();

      sheetBlocks.forEach((sheetBlock, sheetIdx) => {
        const sid = sheetBlock.dataset.sid;
        const cards = getItems(sid);
        const sheetName = safeSheetName(val(`sname-${sid}`), sheetIdx);
        const project = val(`sproject-${sid}`);
        const insType = val(`stype-${sid}`);
        const dateStr = fmtDate(val(`sdate-${sid}`));
        const sign1 = val(`ssign1-${sid}`) || 'PM';
        const sign2 = val(`ssign2-${sid}`) || 'SM';

        updateLoading(`Menyusun sheet ${sheetIdx + 1} dari ${sheetBlocks.length}: ${sheetName}...`);

        const ws = wb.addWorksheet(sheetName);
        ws.views = [{ showGridLines: false }];
        ws.columns = colWidths.map(w => ({ width: w }));

        // --- Border: gabung (union) dengan edge yang sudah ada. ---
        // Di ExcelJS, style pada cell "slave" dalam sebuah merge diteruskan ke
        // MASTER-nya; kalau ditimpa langsung, sisi yang sudah digambar bisa hilang.
        function setBorder(row, col, edges) {
          const cell = ws.getCell(row, col);
          const prev = cell.border || {};
          cell.border = {
            top: edges.top || prev.top, bottom: edges.bottom || prev.bottom,
            left: edges.left || prev.left, right: edges.right || prev.right
          };
        }
        function boxRange(r1, r2, c1, c2) {
          for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) {
            setBorder(r, c, {
              top: r === r1 ? thin : undefined, bottom: r === r2 ? thin : undefined,
              left: c === c1 ? thin : undefined, right: c === c2 ? thin : undefined
            });
          }
        }
        function put(r1, c1, r2, c2, value, opt = {}) {
          if (r2 > r1 || c2 > c1) ws.mergeCells(r1, c1, r2, c2);
          const cell = ws.getCell(r1, c1);
          if (value !== undefined) cell.value = value;
          cell.alignment = Object.assign({ vertical: 'middle', wrapText: true }, opt.align || {});
          cell.font = Object.assign({ name: 'Arial Narrow', size: 9 }, opt.font || {});
          if (opt.fill) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: opt.fill } };
          if (opt.box !== false) boxRange(r1, r2, c1, c2);
          return cell;
        }

        // --- Anchor foto: tl + br (twoCellAnchor) ---
        // Dengan ext (oneCellAnchor) ukuran foto absolut dalam EMU, sedangkan grid
        // sel menyusut saat fitToWidth -> foto jadi melewati border. Dengan br,
        // kedua sudut terikat ke koordinat sel sehingga ikut menyusut proporsional.
        function rangeWidthPx(c1, c2) {
          let t = 0; for (let c = c1; c <= c2; c++) t += colWidthToPx(colWidths[c - 1]); return t;
        }
        function pxToColFrac(cStart, px) {
          let rem = Math.max(0, px), col = cStart - 1;
          while (col < colWidths.length - 1) {
            const w = colWidthToPx(colWidths[col]);
            if (rem < w) break;
            rem -= w; col++;
          }
          return col + (rem / colWidthToPx(colWidths[col]));
        }
        function pxToRowFrac(rStart, px) {
          let rem = Math.max(0, px), r = rStart;
          while (true) {
            const h = (rowH[r] || H_ROW) * PT2PX;
            if (rem < h) break;
            rem -= h; r++;
          }
          return (r - 1) + (rem / ((rowH[r] || H_ROW) * PT2PX));
        }
        // Selalu ikat kedua sudut gambar ke grid Excel. Anchor tl + ext memakai
        // ukuran absolut dan tidak mengikuti skala cetak, sehingga foto bisa
        // keluar dari kotaknya saat worksheet diperkecil untuk dicetak.
        // preserveAspect menghitung ruang kosong agar foto tetap proporsional.
        function placeImage(imgId, c1, c2, r1, r2, imgW, imgH, pad = 4, preserveAspect = false) {
          const areaW = rangeWidthPx(c1, c2);
          let areaH = 0;
          for (let r = r1; r <= r2; r++) areaH += (rowH[r] || H_ROW) * PT2PX;

          const availW = Math.max(10, areaW - pad * 2);
          const availH = Math.max(10, areaH - pad * 2);
          let w = availW, h = availH;
          if (preserveAspect) {
            h = (imgH / imgW) * w;
            if (h > availH) { h = availH; w = (imgW / imgH) * h; }
          }

          const offX = (areaW - w) / 2, offY = (areaH - h) / 2;
          const tl = { col: pxToColFrac(c1, offX), row: pxToRowFrac(r1, offY) };
          const br = { col: pxToColFrac(c1, offX + w), row: pxToRowFrac(r1, offY + h) };
          ws.addImage(imgId, { tl, br, editAs: 'twoCell' });
        }
        function placeFooterLogo(imgId, c1, c2, r1, r2, pad = 1) {
          let areaH = 0;
          for (let r = r1; r <= r2; r++) areaH += (rowH[r] || H_FOOT) * PT2PX;
          const areaW = rangeWidthPx(c1, c2);
          ws.addImage(imgId, {
            tl: { col: c1 - 1, row: r1 - 1 },
            ext: { width: Math.max(10, areaW - pad * 2), height: Math.max(10, areaH - pad * 2) },
            editAs: 'oneCell'
          });
        }

        // ---------- BLOK HEADER (4 baris) ----------
        function drawHeader(top) {
          // Baris 3 dibuat lebih tinggi karena blok Notes sekarang dwibahasa.
          rowH[top] = H_TITLE1; rowH[top + 1] = H_TITLE1; rowH[top + 2] = H_TITLE3; rowH[top + 3] = H_ROW;

          // --- Judul & identitas: font 16 supaya terbaca jelas saat dicetak
          // (halaman diskalakan ~50% oleh fitToWidth, jadi 16pt tampil setara ~8pt di kertas).
          const FONT_BIG = { name: 'Arial', size: 16, bold: true };

          put(top, 1, top + 1, 2, 'PHOTOGRAPH OF \nINSPECTION LIST',
              { align: { horizontal: 'center' }, font: FONT_BIG });
          put(top + 2, 1, top + 2, 2, insType, { align: { horizontal: 'center' }, font: FONT_BIG });

          put(top, 3, top + 1, 3, 'Project', { align: { horizontal: 'left' }, font: FONT_BIG });
          put(top, 4, top + 1, 6, ': ' + project, { align: { horizontal: 'left' }, font: FONT_BIG });
          put(top + 2, 3, top + 2, 3, 'Date', { align: { horizontal: 'left' }, font: FONT_BIG });
          put(top + 2, 4, top + 2, 6, ': ' + dateStr, { align: { horizontal: 'left' }, font: FONT_BIG });

          // --- Label "Notes" diputar 90 derajat.
          // Sebelumnya kolom G terlalu sempit sehingga teks terpotong jadi "Note s".
          put(top, 7, top + 2, 7, 'Notes', {
            align: { horizontal: 'center', vertical: 'middle', textRotation: 90 },
            font: { name: 'Arial', size: 10, bold: true }
          });

          // --- Isi Notes: Inggris di atas, terjemahan Indonesia di bawah.
          // Dipisah jadi DUA blok merge supaya ada garis border di antaranya.
          put(top, 8, top + 1, 12, NOTES_TEXT,
              { align: { horizontal: 'left', vertical: 'top' }, font: { name: 'Arial Narrow', size: 7 } });
          put(top + 2, 8, top + 2, 12, NOTES_TEXT_ID,
              { align: { horizontal: 'left', vertical: 'top' }, font: { name: 'Arial Narrow', size: 7, italic: true } });

          // --- Kolom tanda tangan: label diambil dari input, tidak lagi dipatok PM/SM
          put(top, 13, top, 14, sign1, { align: { horizontal: 'center' }, font: { bold: true } });
          put(top, 15, top, 17, sign2, { align: { horizontal: 'center' }, font: { bold: true } });
          put(top + 1, 13, top + 2, 14, '');   // area tanda tangan 1
          put(top + 1, 15, top + 2, 17, '');   // area tanda tangan 2

          put(top + 3, 1, top + 3, 17, 'INSPECTION LIST',
              { align: { horizontal: 'center' }, font: { name: 'Arial', size: 11, bold: true } });

          return top + 4;
        }

        // ---------- BLOK TEMUAN (14 baris) ----------
        function drawItem(top, num, id) {
          for (let i = 0; i < ITEM_ROWS; i++) rowH[top + i] = H_ROW;
          const d = storeData[id] || {};
          const lv = val(`level-${id}`) || 'Low';
          const fillLv = lv === 'High' ? 'FFFFC7CE' : (lv === 'Medium' ? 'FFFFEB9C' : 'FFC6EFCE');

          // Baris judul kolom
          const barFont = { bold: true, name: 'Arial Narrow', size: 9 };
          const barFill = 'FFE2EFDA';
          put(top, 1, top, 1, 'NO', { align: { horizontal: 'center' }, font: barFont, fill: barFill });
          put(top, 2, top, 2, 'FINDING', { align: { horizontal: 'center' }, font: barFont, fill: barFill });
          put(top, 3, top, 6, 'PHOTO', { align: { horizontal: 'center' }, font: barFont, fill: barFill });
          put(top, 8, top, 8, 'CORRECTIVE ACTION', { align: { horizontal: 'center' }, font: barFont, fill: barFill });
          put(top, 9, top, 13, 'PHOTO', { align: { horizontal: 'center' }, font: barFont, fill: barFill });
          put(top, 14, top, 17, 'INFORMATION', { align: { horizontal: 'center' }, font: barFont, fill: barFill });

          // Kolom G = pemisah antara blok FINDING dan CORRECTIVE
          put(top, 7, top + ITEM_ROWS - 1, 7, '', { box: false });

          // Kolom NO
          put(top + 1, 1, top + ITEM_ROWS - 1, 1, num, { align: { horizontal: 'center', vertical: 'top' } });

          // Sisi FINDING
          put(top + 1, 2, top + 1, 2, 'AREA/DESCRIPTION :', { align: { horizontal: 'left' }, font: { bold: true, name: 'Arial Narrow', size: 9 } });
          put(top + 2, 2, top + 2, 2, val(`area-${id}`), { align: { horizontal: 'left' }, font: { bold: true, name: 'Arial Narrow', size: 9 } });
          put(top + 3, 2, top + ITEM_ROWS - 1, 2, val(`finding-${id}`), { align: { horizontal: 'left', vertical: 'top' } });
          put(top + 1, 3, top + ITEM_ROWS - 1, 6, '');   // area foto temuan

          // Sisi CORRECTIVE ACTION
          put(top + 1, 8, top + 1, 8, 'AREA :', { align: { horizontal: 'left' }, font: { bold: true, name: 'Arial Narrow', size: 9 } });
          put(top + 2, 8, top + 2, 8, val(`area-${id}`), { align: { horizontal: 'left' }, font: { bold: true, name: 'Arial Narrow', size: 9 } });
          put(top + 3, 8, top + ITEM_ROWS - 1, 8, val(`corrective-${id}`), { align: { horizontal: 'left', vertical: 'top' } });
          put(top + 1, 9, top + ITEM_ROWS - 1, 13, '');  // area foto perbaikan

          // Kolom INFORMATION
          put(top + 1, 14, top + 4, 14, 'INSPECTOR', { align: { horizontal: 'center' }, font: { bold: true, name: 'Arial Narrow', size: 9 } });
          put(top + 1, 15, top + 4, 17, val(`inspector-${id}`), { align: { horizontal: 'center' } });
          put(top + 5, 14, top + 8, 14, 'PIC', { align: { horizontal: 'center' }, font: { bold: true, name: 'Arial Narrow', size: 9 } });
          put(top + 5, 15, top + 8, 17, val(`pic-${id}`), { align: { horizontal: 'center' } });
          put(top + 9, 14, top + 9, 15, 'FINISH DATE', { align: { horizontal: 'center' }, font: { bold: true, name: 'Arial Narrow', size: 8 } });
          put(top + 9, 16, top + 9, 17, 'FINDING LEVEL', { align: { horizontal: 'center' }, font: { bold: true, name: 'Arial Narrow', size: 8 } });
          put(top + 10, 14, top + ITEM_ROWS - 1, 15, fmtDate(val(`finish-${id}`)), { align: { horizontal: 'center' } });
          put(top + 10, 16, top + ITEM_ROWS - 1, 17, lv, { align: { horizontal: 'center' }, font: { bold: true, name: 'Arial Narrow', size: 9 }, fill: fillLv });

          // Foto temuan (before) & perbaikan (after)
          if (d.beforeImg) {
            const imgId = wb.addImage({ base64: d.beforeImg, extension: 'jpeg' });
            placeImage(imgId, 3, 6, top + 1, top + ITEM_ROWS - 1, d.beforeW || 1, d.beforeH || 1, 4, true);
          }
          if (d.afterImg) {
            const imgId = wb.addImage({ base64: d.afterImg, extension: 'jpeg' });
            placeImage(imgId, 9, 13, top + 1, top + ITEM_ROWS - 1, d.afterW || 1, d.afterH || 1, 4, true);
          }

          return top + ITEM_ROWS;
        }

        // ---------- BLOK FOOTER (2 baris) ----------
        function drawFooter(top, page, totalPages) {
          rowH[top] = H_FOOT; rowH[top + 1] = H_FOOT;

          // Logo memenuhi seluruh area footer yang digabung A:B.
          // Teks form mulai di kolom C, sehingga logo tetap di area A:B.
          // Kotak footer dan anchor gambar mencakup area gabungan A:B.
          //
          // Logo ditempatkan selebar area footer A:B.
          // Padding 1px menjaga jarak gambar dari garis kotak.
          //
          // Dimensi diambil dari logo yang SUDAH dipotong marginnya (lihat trimLogo).
          // Tanpa itu Excel ikut memuat 18px ruang transparan di atas & 10px di
          // bawah, sehingga logo melenceng ke bawah dan tidak center.
          put(top, 1, top + 1, 2, '');
          // Gambar memenuhi area untuk menghindari logo yang terlalu kecil.
          placeFooterLogo(logoId, 1, 2, top, top + 1);

          put(top, 3, top, 13, 'Photograph of Inspection List', { align: { horizontal: 'left' } });
          put(top, 14, top, 17, 'Date : 7 November 2025', { align: { horizontal: 'left' } });
          put(top + 1, 3, top + 1, 8, 'Form No. QP-006-02 (b)', { align: { horizontal: 'left' }, font: { italic: true, name: 'Arial Narrow', size: 9 } });
          put(top + 1, 9, top + 1, 13, 'Rev : 0', { align: { horizontal: 'left' } });
          put(top + 1, 14, top + 1, 17, `Page : ${page} of ${totalPages}`, { align: { horizontal: 'left' } });

          return top + 2;
        }

        // ---------- SUSUN HALAMAN ----------
        const totalPages = Math.max(1, Math.ceil(cards.length / ITEMS_PER_PAGE));
        let row = 1;

        for (let p = 0; p < totalPages; p++) {
          row = drawHeader(row);
          const slice = cards.slice(p * ITEMS_PER_PAGE, (p + 1) * ITEMS_PER_PAGE);

          slice.forEach((card, i) => {
            if (i > 0) { rowH[row] = H_GAP; row++; }   // baris pemisah antar temuan
            row = drawItem(row, p * ITEMS_PER_PAGE + i + 1, card.dataset.id);
          });

          row = drawFooter(row, p + 1, totalPages);

          if (p < totalPages - 1) {
            ws.getRow(row - 1).addPageBreak();   // page break fisik antar halaman
          }
        }

        // Kunci tinggi tiap baris; tanpa ini Excel bisa auto-fit karena wrapText,
        // sehingga kotak jadi lebih pendek dari asumsi dan foto terlihat terpotong.
        for (let r = 1; r < row; r++) ws.getRow(r).height = rowH[r] || H_ROW;

        // LANDSCAPE + fitToWidth: lebar 17 kolom (~15.2 in) diskalakan otomatis ke
        // ~73%. Dibanding portrait (~50%), teks & foto tampil jauh lebih besar dan
        // terbaca, dan tidak perlu ganti orientasi manual tiap kali Ctrl+P.
        ws.pageSetup = {
          orientation: 'landscape',
          fitToPage: true,
          fitToWidth: 1,
          fitToHeight: 0,
          paperSize: 9,
          horizontalCentered: true,
          margins: { left: 0.3, right: 0.3, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 }
        };
      });

      updateLoading('Menulis file Excel...');
      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

      const blocks = getSheets();
      const rawName = blocks.length === 1 ? (val(`sname-${blocks[0].dataset.sid}`) || 'Inspection') : `MultiSheet_${blocks.length}`;
      const safe = String(rawName).replace(/[\\/:*?"<>|]/g, '-').trim();
      const dv = blocks.length ? val(`sdate-${blocks[0].dataset.sid}`) : '';

      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Photo_Inspection_List_${safe}${dv ? '_' + dv : ''}.xlsx`;
      a.click();
      URL.revokeObjectURL(a.href);

      showToast('success', 'Excel berhasil dibuat',
        `File "${a.download}" (${(blob.size / 1024 / 1024).toFixed(2)} MB) sudah didownload.`, 5000);
    } catch (err) {
      console.error(err);
      showToast('error', 'Gagal generate Excel', (err && err.message) ? err.message : 'Terjadi kesalahan tak terduga.', 6000);
    } finally {
      hideLoading();
    }
  }

  // ================= POPUP TUTORIAL =================
  // Panduan singkat, dibuka lewat tombol "Cara Pakai" di pojok kiri atas.
  // Otomatis muncul sekali saja untuk pemakai baru; setelah ditutup, tandanya
  // disimpan di localStorage supaya tidak mengganggu setiap kali dibuka.
  const TUTORIAL_SEEN_KEY = 'qcPhotoInspection_tutorialSeen_v1';

  function openTutorial() {
    const ov = document.getElementById('tutorialModal');
    ov.classList.add('active');
    ov.scrollTop = 0;              // selalu mulai dari bab 1, bukan posisi terakhir
    document.body.style.overflow = 'hidden';
  }

  function closeTutorial() {
    document.getElementById('tutorialModal').classList.remove('active');
    document.body.style.overflow = '';
    try { localStorage.setItem(TUTORIAL_SEEN_KEY, '1'); } catch (e) { /* abaikan */ }
  }

  // Lompat ke bab tertentu lewat tombol navigasi di atas
  function tutGo(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Tutup dengan Esc atau klik area gelap
  document.addEventListener('keydown', e => {
    if (annCur) return;   // editor anotasi berada di atas panduan
    if (e.key === 'Escape' && document.getElementById('tutorialModal').classList.contains('active')) {
      closeTutorial();
    }
  });
  document.getElementById('tutorialModal').addEventListener('click', e => {
    if (e.target.id === 'tutorialModal') closeTutorial();
  });

  // ================= MODE CLASSIC / NEW =================
  const PHOTO_LAYOUT_KEY = 'qcPhotoInspection_layoutMode_v1';
  const photoCompactLayout = window.matchMedia('(max-width: 1024px)');
  function applyPhotoLayout(mode, remember) {
    const classic = mode === 'classic';
    const root = document.getElementById('inspectionFormContainer');
    const toggle = document.getElementById('photoLayoutToggle');
    const label = document.getElementById('photoLayoutLabel');
    if (root) root.classList.toggle('photo-classic', classic);
    document.body.classList.toggle('photo-classic-body', classic);
    if (toggle) toggle.checked = classic;
    if (label) label.textContent = classic ? 'Classic' : 'New';
    if (remember !== false) { try { localStorage.setItem(PHOTO_LAYOUT_KEY, classic ? 'classic' : 'new'); } catch (e) {} }
  }
  function togglePhotoLayout(classic) { applyPhotoLayout(classic ? 'classic' : 'new'); }
  window.addEventListener('message', function (e) {
    if (e.data && e.data.jo === 'layout-mode') applyPhotoLayout(e.data.mode, false);
  });

  // ================= INISIALISASI =================
  let savedPhotoLayout = 'new';
  try { savedPhotoLayout = localStorage.getItem(PHOTO_LAYOUT_KEY) || 'new'; } catch (e) {}
  applyPhotoLayout(photoCompactLayout.matches ? 'new' : savedPhotoLayout, false);
  onQualityChange();
  addSheet({}, { silent: true });
  checkDraftOnLoad();

  // Tampilkan panduan otomatis HANYA saat pertama kali dipakai di browser ini.
  // Ditunda 600ms supaya form sempat tergambar dulu -- kalau langsung muncul,
  // orang jadi tidak tahu apa yang ada di baliknya.
  try {
    if (!localStorage.getItem(TUTORIAL_SEEN_KEY)) {
      setTimeout(openTutorial, 600);
    }
  } catch (e) { /* localStorage diblokir -> lewati saja */ }

<\/script>
</body>
</html>
