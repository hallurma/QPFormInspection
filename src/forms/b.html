    const blocks = getSheets();
    if (!blocks.length) { bar.innerHTML = ''; return; }
    if (!activeSid || !document.getElementById(`sheet-${activeSid}`)) activeSid = blocks[0].dataset.sid;

    let html = '';
    blocks.forEach((sb, idx) => {
      const sid = sb.dataset.sid;
      const nameEl = document.getElementById(`sname-${sid}`);
      const name = (nameEl && nameEl.value.trim()) || `Sheet ${idx + 1}`;
      const n = getItems(sid).length;
      const isActive = String(sid) === String(activeSid);
      html += `<div class="sheet-tab ${isActive ? 'active' : ''}" onclick="switchSheet('${sid}')" title="${esc(name)}">
                 <span class="tab-name">${esc(name)}</span><span class="tab-badge">${n}</span>
               </div>`;
    });
    html += `<button class="btn-tabadd" onclick="addSheet()" title="Tambah sheet baru">+</button>`;
    bar.innerHTML = html;

    blocks.forEach(sb => sb.classList.toggle('hidden', sb.dataset.sid !== String(activeSid)));
  }
  function switchSheet(sid) { activeSid = String(sid); renderTabs(); }

  function removeSheet(sid) {
    if (getSheets().length <= 1) {
      showToast('error', 'Minimal 1 sheet', 'Tidak bisa menghapus sheet terakhir.', 3000);
      return;
    }
    const n = getItems(sid).length;
    if (n > 0 && !confirm(`Hapus sheet ini beserta ${n} temuannya?`)) return;

    const blocks = getSheets();
    const idx = blocks.findIndex(b => b.dataset.sid === String(sid));
    const nextBlock = blocks[idx + 1] || blocks[idx - 1];
    activeSid = nextBlock ? nextBlock.dataset.sid : null;

    getItems(sid).forEach(c => delete storeData[c.dataset.id]);
    if (typeof sheetSignatures !== 'undefined') delete sheetSignatures[sid];
    document.getElementById(`sheet-${sid}`).remove();
    renumberSheets();
    scheduleSave();
  }

  function moveSheet(sid, dir) {
    const block = document.getElementById(`sheet-${sid}`);
    const container = document.getElementById('sheetsContainer');
    const blocks = getSheets();
    const idx = blocks.indexOf(block);
    const target = idx + dir;
    if (target < 0 || target >= blocks.length) return;
    if (dir < 0) container.insertBefore(block, blocks[target]);
    else container.insertBefore(blocks[target], block);
    activeSid = String(sid);
    renumberSheets();
    scheduleSave();
  }

  function renumberSheets() {
    getSheets().forEach((sb, idx) => {
      const sid = sb.dataset.sid;
      const btns = sb.querySelector('.sheet-tools').querySelectorAll('.btn-move');
      if (btns[0]) btns[0].disabled = (idx === 0);
      if (btns[1]) btns[1].disabled = (idx === getSheets().length - 1);

      const n = getItems(sid).length;
      const pages = Math.max(1, Math.ceil(n / ITEMS_PER_PAGE));
      document.getElementById(`scount-${sid}`).textContent =
        n === 0 ? 'Sheet ini belum ada temuan' : `${n} temuan · ${pages} halaman cetak`;
      renumberItems(sid);
    });
    renderTabs();
  }

  // ================= TAMBAH TEMUAN =================
  // Tiap temuan menyimpan sepasang foto: 'before' (kondisi temuan) dan
  // 'after' (setelah diperbaiki). Struktur storeData per sisi:
  //   <side>Orig : hasil normalisasi EXIF + kompresi (SUMBER, tidak pernah diubah)
  //   <side>Img  : hasil akhir setelah rotasi, ini yang dipakai preview & Excel
  //   <side>Rot  : sudut kumulatif (0/90/180/270)
  function addItem(sid, preset = {}, opts = {}) {
    itemCount++;
    const id = itemCount;
    const posIndex = getItems(sid).length;

    storeData[id] = {
      beforeOrig: null, beforeImg: null, beforeW: 0, beforeH: 0, beforeRot: 0,
      afterOrig: null,  afterImg: null,  afterW: 0,  afterH: 0,  afterRot: 0,
      beforeAnn: [], afterAnn: [], beforeStamp: null, afterStamp: null
    };

    const v = k => esc(preset[k] != null ? preset[k] : '');

    const html = `
      <div class="card-item lv-low" id="card-${id}" data-id="${id}">
        <div class="card-toolbar">
          <span class="tb-left">
            <span class="item-label">Temuan #${posIndex + 1}</span>
            <span class="lv-badge low" id="lvbadge-${id}">LOW</span>
          </span>
          <span class="item-tools">
            <button class="btn-move" title="Naikkan" onclick="moveItem(${id}, -1)">▲</button>
            <button class="btn-move" title="Turunkan" onclick="moveItem(${id}, 1)">▼</button>
            <button class="btn-del" onclick="removeItem(${id})">Hapus</button>
          </span>
        </div>

        <!-- Susunan kolom meniru form QP-006-02 (b) -->
        <div class="ftbl-scroll">
        <div class="ftbl">
          <div class="ft-h">NO</div>
          <div class="ft-h">FINDING</div>
          <div class="ft-h">PHOTO</div>
          <div class="ft-h">CORRECTIVE ACTION</div>
          <div class="ft-h">PHOTO</div>
          <div class="ft-h">INFORMATION</div>

          <div class="ft-b ft-no" id="ftno-${id}">${posIndex + 1}</div>

          <div class="ft-b">
            <div class="ft-sub">AREA/DESCRIPTION :</div>
            <input type="text" class="ft-inp" id="area-${id}" value="${v('area')}" placeholder="SOC Room">
            <textarea class="ft-ta" id="finding-${id}" placeholder="Tulis deskripsi &amp; temuan di sini, dalam Bahasa Indonesia dan English.&#10;Contoh:&#10;Repair dike wall &amp; finish painting">${v('finding')}</textarea>
          </div>

          <div class="ft-b ft-c3 ft-photo">
            <div class="drop-box" id="dz-before-${id}" tabindex="0" onclick="document.getElementById('file-before-${id}').click()">
              <span>📸</span>
              <p>Drag &amp; Drop Foto Temuan</p>
              <p class="paste-hint">bisa banyak foto sekaligus · Ctrl+V juga bisa</p>
              <div class="preview-wrap" id="wrap-before-${id}" style="display:none;">
                <img id="prev-before-${id}" class="preview-img">
                <button type="button" class="btn-annot" title="Buka foto besar untuk memberi panah / kotak / keterangan"
                        onclick="event.stopPropagation(); annOpen(${id},'before')">✏️ Anotasi</button>
                <span class="annot-badge" id="annbadge-before-${id}"></span>
              </div>
              <input type="file" id="file-before-${id}" accept="image/*" multiple style="display:none" onchange="fileChosen(event, ${id}, 'before')">
            </div>
          </div>

          <div class="ft-b">
            <div class="ft-sub">AREA :</div>
            <div class="ft-mirror" id="areamirror-${id}" title="Otomatis mengikuti Area di kolom FINDING">${v('area')}</div>
            <textarea class="ft-ta" id="corrective-${id}" placeholder="Tindakan perbaikan dalam Bahasa Indonesia dan English.&#10;Contoh:&#10;Berikut foto perbaikan sudah diprovide.">${v('corrective')}</textarea>
          </div>

          <div class="ft-b ft-c5 ft-photo">
            <div class="drop-box" id="dz-after-${id}" tabindex="0" onclick="document.getElementById('file-after-${id}').click()">
              <span>🖼️</span>
              <p>Drag &amp; Drop Foto Perbaikan</p>
              <p class="paste-hint">ambil dari sudut yang sama · Ctrl+V juga bisa</p>
              <div class="preview-wrap" id="wrap-after-${id}" style="display:none;">
                <img id="prev-after-${id}" class="preview-img">
                <button type="button" class="btn-annot" title="Buka foto besar untuk memberi panah / kotak / keterangan"
                        onclick="event.stopPropagation(); annOpen(${id},'after')">✏️ Anotasi</button>
                <span class="annot-badge" id="annbadge-after-${id}"></span>
              </div>
              <input type="file" id="file-after-${id}" accept="image/*" style="display:none" onchange="fileChosen(event, ${id}, 'after')">
            </div>
          </div>

          <div class="ft-b ft-info">
            <div class="inf-row">
              <div class="inf-lbl">INSPECTOR
                <button type="button" class="btn-filldown" title="Salin ke semua temuan di bawahnya" onclick="fillDown(${id},'inspector')">&darr;</button>
              </div>
              <div class="inf-val">
                <input type="text" id="inspector-${id}" value="${v('inspector')}" placeholder="Nama inspector">
                <span class="hint-manual" id="hint-inspector-${id}"></span>
              </div>
            </div>
            <div class="inf-row">
              <div class="inf-lbl">PIC</div>
              <div class="inf-val">
                <input type="text" id="pic-${id}" value="${v('pic')}" placeholder="Penanggung jawab">
              </div>
            </div>
            <div class="inf-split">
              <div class="inf-cell">
                <div class="inf-lbl">FINISH DATE
                  <button type="button" class="btn-filldown" title="Salin ke semua temuan di bawahnya" onclick="fillDown(${id},'finish')">&darr;</button>
                </div>
                <div>
                  <input type="date" id="finish-${id}" value="${v('finish')}">
                  <span class="hint-manual" id="hint-finish-${id}"></span>
                </div>
              </div>
              <div class="inf-cell">
                <div class="inf-lbl">FINDING LEVEL</div>
                <div>
                  <select id="level-${id}" class="lvl-low" onchange="onLevelChange(${id})">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>
        </div>
      </div>
    `;

    document.getElementById(`items-${sid}`).insertAdjacentHTML('beforeend', html);
    if (preset.level) document.getElementById(`level-${id}`).value = preset.level;
    onLevelChange(id);

    // Kolom "AREA :" di sisi CORRECTIVE ACTION memakai nilai Area yang sama
    // (di Excel memang begitu), jadi di UI dibuat cerminan yang ikut berubah
    // realtime -- bukan input kedua, supaya tidak ada dua sumber kebenaran.
    const areaEl = document.getElementById(`area-${id}`);
    const mirrorEl = document.getElementById(`areamirror-${id}`);
    areaEl.addEventListener('input', () => { mirrorEl.textContent = areaEl.value; });

    // ===== Inspector & Finish Date: isi sekali di atas, terisi ke bawah =====
    // Nilai dari temuan PERTAMA otomatis menurun ke temuan di bawahnya.
    // Begitu sebuah temuan diubah manual, field itu ditandai (manual-edit) dan
    // TIDAK ikut tertimpa lagi -- jadi pengecualian per nomor tetap bisa.
    AUTOFILL_FIELDS.forEach(key => {
      const el = document.getElementById(`${key}-${id}`);
      if (!el) return;

      // Draft bisa menyimpan status "sudah diubah manual"
      if (preset[key + 'Manual']) markManual(el, key, id, true);

      el.addEventListener('input', () => {
        const cards = getItems(sid);
        const idx = cards.findIndex(c => String(c.dataset.id) === String(id));
        if (idx === 0) {
          propagateDown(sid, key, 0, false);   // temuan #1 = sumber
        } else {
          markManual(el, key, id, true);       // sisanya dianggap pengecualian
        }
        scheduleSave();
      });
    });

    // Temuan baru mewarisi nilai dari temuan #1 (kecuali draft sudah punya isinya)
    if (posIndex > 0) {
      const cards = getItems(sid);
      const firstId = cards[0] ? cards[0].dataset.id : null;
      if (firstId && String(firstId) !== String(id)) {
        AUTOFILL_FIELDS.forEach(key => {
          if (preset[key]) return;
          const src = document.getElementById(`${key}-${firstId}`);
          const dst = document.getElementById(`${key}-${id}`);
          if (src && dst && !dst.value) dst.value = src.value;
        });
      }
    }

    initDragDrop(id, 'before');
    initDragDrop(id, 'after');

    if (!opts.silent) { renumberSheets(); scheduleSave(); }
    return id;
  }

  // ================= ISI KE BAWAH (Inspector & Finish Date) =================
  const AUTOFILL_FIELDS = ['inspector', 'finish'];

  function markManual(el, key, id, on) {
    el.classList.toggle('manual-edit', on);
    if (on) el.dataset.manual = '1'; else delete el.dataset.manual;
    const hint = document.getElementById(`hint-${key}-${id}`);
    if (hint) hint.textContent = on ? '(diubah manual)' : '';
  }

  // Salin nilai dari temuan ke-fromIdx ke semua temuan di bawahnya.
  // force = true -> timpa juga yang sudah diubah manual (dipakai tombol "isi ke bawah").
  function propagateDown(sid, key, fromIdx, force) {
    const cards = getItems(sid);
    if (fromIdx < 0 || fromIdx >= cards.length) return 0;

    const srcEl = document.getElementById(`${key}-${cards[fromIdx].dataset.id}`);
    if (!srcEl) return 0;
    const value = srcEl.value;

    let n = 0;
    for (let i = fromIdx + 1; i < cards.length; i++) {
      const cid = cards[i].dataset.id;
      const el = document.getElementById(`${key}-${cid}`);
      if (!el) continue;
      if (!force && el.dataset.manual === '1') continue;  // hormati pengecualian
      el.value = value;
      if (force) markManual(el, key, cid, false);
      n++;
    }
    return n;
  }

  function fillDown(id, key) {
    const sid = sidOfItem(id);
    const cards = getItems(sid);
    const idx = cards.findIndex(c => String(c.dataset.id) === String(id));
    if (idx === cards.length - 1) {
      showToast('info', 'Sudah temuan terakhir', 'Tidak ada temuan di bawahnya.', 2500);
      return;
    }
    const label = key === 'inspector' ? 'Inspector' : 'Finish Date';
    const n = propagateDown(sid, key, idx, true);
    scheduleSave();
    showToast('success', `${label} disalin`, `${n} temuan di bawahnya ikut diisi (termasuk yang tadinya diubah manual).`, 3500);
  }

  // Warna kartu & badge mengikuti Finding Level, biar temuan berisiko tinggi
  // langsung kelihatan saat menggulir daftar yang panjang.
  function onLevelChange(id) {
    const sel = document.getElementById(`level-${id}`);
    if (!sel) return;
    const lv = sel.value.toLowerCase();
    const card = document.getElementById(`card-${id}`);
    const badge = document.getElementById(`lvbadge-${id}`);
    card.className = `card-item lv-${lv}`;
    badge.className = `lv-badge ${lv}`;
    badge.textContent = sel.value.toUpperCase();
    // Warnai dropdown sama seperti sel FINDING LEVEL di Excel
    sel.className = `lvl-${lv}`;
    scheduleSave();
  }

  function renumberItems(sid) {
    const container = document.getElementById(`items-${sid}`);
    if (!container) return;
    container.querySelectorAll('.page-divider').forEach(d => d.remove());

    const cards = Array.from(container.querySelectorAll('.card-item'));
    cards.forEach((card, idx) => {
      const label = card.querySelector('.item-label');
      if (label) label.textContent = `Temuan #${idx + 1}`;

      // Kolom NO di dalam tabel form ikut dinomori ulang
      const noCell = document.getElementById(`ftno-${card.dataset.id}`);
      if (noCell) noCell.textContent = idx + 1;

      const btns = card.querySelector('.item-tools').querySelectorAll('.btn-move');
      if (btns[0]) btns[0].disabled = (idx === 0);
      if (btns[1]) btns[1].disabled = (idx === cards.length - 1);

      if (idx > 0 && idx % ITEMS_PER_PAGE === 0) {
        const div = document.createElement('div');
        div.className = 'page-divider';
        div.textContent = `Halaman ${Math.floor(idx / ITEMS_PER_PAGE) + 1}`;
        container.insertBefore(div, card);
      }
    });
  }

  // ================= HAPUS TEMUAN + UNDO =================
  // Sebelumnya removeItem() langsung menghapus tanpa konfirmasi apa pun. Satu
  // salah klik = temuan beserta fotonya hilang, padahal foto aslinya mungkin
  // sudah tidak ada lagi di HP. Sekarang isinya disalin dulu ke lastDeleted,
  // lalu ditawarkan tombol "Batalkan" lewat toast selama beberapa detik.
  let lastDeleted = null;

  // Semua field teks milik satu temuan. Dikumpulkan di satu tempat supaya
  // kalau nanti ada field baru, cukup ditambahkan di sini sekali.
  const ITEM_FIELDS = ['area', 'finding', 'corrective', 'inspector', 'pic', 'finish', 'level'];

  function removeItem(id) {
    const card = document.getElementById(`card-${id}`);
    if (!card) return;
    const sid = sidOfItem(id);

    // Salin seluruh isi temuan SEBELUM node-nya dibuang
    const cards = getItems(sid);
    const posIndex = cards.findIndex(c => String(c.dataset.id) === String(id));

    const preset = {};
    ITEM_FIELDS.forEach(k => { preset[k] = val(`${k}-${id}`); });
    // Status "diubah manual" ikut disimpan, supaya temuan yang tadinya jadi
    // pengecualian tidak berubah jadi ikut terisi otomatis setelah dipulihkan.
    AUTOFILL_FIELDS.forEach(k => {
      preset[k + 'Manual'] = (document.getElementById(`${k}-${id}`) || {}).dataset?.manual === '1';
    });

    lastDeleted = {
      sid,
      posIndex,                                   // supaya bisa dikembalikan ke urutan semula
      preset,
      data: Object.assign({}, storeData[id] || {}) // termasuk foto & anotasinya
    };

    card.remove();
    delete storeData[id];

    // Sheet tidak boleh kosong sama sekali -> otomatis diberi satu temuan baru
    let autoAdded = false;
    if (sid && getItems(sid).length === 0) {
      addItem(sid, {}, { silent: true });
      autoAdded = true;
    }
    lastDeleted.autoAdded = autoAdded;

    renumberSheets();
    scheduleSave();

    const d = lastDeleted.data;
    const punyaFoto = !!(d.beforeOrig || d.afterOrig);
    const nAnn = (d.beforeAnn || []).length + (d.afterAnn || []).length;
    showToast('info', 'Temuan dihapus',
      (punyaFoto ? 'Foto' + (nAnn ? ' & anotasinya' : '') + ' ikut terhapus. ' : '') +
      '<button class="toast-act" onclick="undoRemoveItem()">↶ Batalkan</button>',
      8000);
  }

  function undoRemoveItem() {
    if (!lastDeleted) { showToast('info', 'Tidak ada yang bisa dibatalkan', '', 2500); return; }
    const { sid, posIndex, preset, data, autoAdded } = lastDeleted;

    if (!document.getElementById(`sheet-${sid}`)) {
      showToast('error', 'Gagal membatalkan', 'Sheet-nya sudah tidak ada.', 3500);
      lastDeleted = null;
      return;
    }

    // Kalau tadi sheet sempat diisi temuan kosong otomatis, buang dulu supaya
    // tidak menyisakan temuan kosong yang tidak pernah diminta user.
    if (autoAdded) {
      const sisa = getItems(sid);
      if (sisa.length === 1) {
        const cid = sisa[0].dataset.id;
        const dd = storeData[cid] || {};
        const kosong = !dd.beforeOrig && !dd.afterOrig &&
          !val(`area-${cid}`) && !val(`finding-${cid}`) && !val(`corrective-${cid}`);
        if (kosong) { sisa[0].remove(); delete storeData[cid]; }
      }
    }

    const newId = addItem(sid, preset, { silent: true });

    // addItem sudah mengisi dari preset, TAPI field yang nilainya kosong bisa
    // ikut terisi otomatis dari temuan #1 (lihat pewarisan di addItem).
    // Untuk undo yang jujur, nilainya ditulis ulang persis seperti semula.
    ITEM_FIELDS.forEach(k => {
      const el = document.getElementById(`${k}-${newId}`);
      if (el) el.value = preset[k] || '';
    });
    // Cerminan Area di kolom CORRECTIVE ACTION ikut disegarkan
    const mirror = document.getElementById(`areamirror-${newId}`);
    if (mirror) mirror.textContent = preset.area || '';
    onLevelChange(newId);   // warna kartu & badge mengikuti Finding Level

    // Kembalikan foto + anotasinya, lalu render ulang
    ['before', 'after'].forEach(side => {
      if (!data[side + 'Orig']) return;
      storeData[newId][side + 'Orig'] = data[side + 'Orig'];
      storeData[newId][side + 'Rot']  = data[side + 'Rot'] || 0;
      storeData[newId][side + 'Ann']  = (data[side + 'Ann'] || []).map(a => Object.assign({}, a));
      const wrap = document.getElementById(`wrap-${side}-${newId}`);
      if (wrap) wrap.style.display = 'inline-block';
      renderComposite(newId, side);
    });

    // Kembalikan ke posisi urutan semula
    const container = document.getElementById(`items-${sid}`);
    const card = document.getElementById(`card-${newId}`);
    const list = Array.from(container.querySelectorAll('.card-item'));
    if (posIndex >= 0 && posIndex < list.length - 1) {
      container.insertBefore(card, list[posIndex]);
    }

    lastDeleted = null;
    renumberSheets();
    scheduleSave();
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    showToast('success', 'Temuan dikembalikan', 'Isian, foto, dan anotasinya sudah dipulihkan.', 3000);
  }

  function moveItem(id, dir) {
    const card = document.getElementById(`card-${id}`);
    if (!card) return;
    const container = document.getElementById(`items-${sidOfItem(id)}`);
    const cards = Array.from(container.querySelectorAll('.card-item'));
    const idx = cards.indexOf(card);
    const target = idx + dir;
    if (target < 0 || target >= cards.length) return;
    if (dir < 0) container.insertBefore(card, cards[target]);
    else container.insertBefore(cards[target], card);
    renumberSheets();
    scheduleSave();
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ================= UPLOAD MASSAL: DETEKSI BEFORE/AFTER =================
  // Form ini butuh SEPASANG foto per temuan, jadi upload massal tidak bisa asal
  // isi berurutan. Strategi:
  //   1. Baca nama file -> tentukan sisi (before / after) dari kata kunci.
  //   2. Ambil angka pertama di nama file sebagai nomor pasangan.
  //   3. Foto dengan nomor sama dipasangkan ke temuan yang sama.
  //   4. Foto tanpa penanda diisi berurutan ke slot yang masih kosong.
  const RX_BEFORE = /(before|sebelum|temuan|finding|bfr|\bb\b)/i;
  const RX_AFTER  = /(after|sesudah|setelah|perbaikan|corrective|koreksi|aft|\ba\b)/i;

  function classifySide(filename) {
    const base = filename.replace(/\.[^.]+$/, '');   // buang ekstensi
    if (RX_AFTER.test(base))  return 'after';
    if (RX_BEFORE.test(base)) return 'before';
    return null;
  }
  function pairNumber(filename) {
    const m = filename.replace(/\.[^.]+$/, '').match(/(\d+)/);
    return m ? parseInt(m[1], 10) : null;
  }

  function handleBulkFiles(sid, fileList) {
    const files = Array.from(fileList || []).filter(f => f.type.startsWith('image/'));
    if (!files.length) {
      showToast('error', 'Tidak ada gambar', 'File yang di-drop bukan gambar.', 3000);
      return;
    }
    files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

    // Kelompokkan berdasarkan hasil deteksi nama file
    const tagged = files.map(f => ({ file: f, side: classifySide(f.name), num: pairNumber(f.name) }));
    const hasTag = tagged.some(t => t.side);

    // Rencana penugasan: daftar { file, itemIndex, side }
    const plan = [];

    // Dipakai untuk melaporkan ke user kalau ada foto yang "diselamatkan" dari
    // tabrakan nomor pasangan (lihat catatan panjang di bawah).
    let dupRescued = 0;

    if (hasTag) {
      // Mode berpasangan: kelompokkan per nomor, tiap nomor -> 1 temuan
      const groups = new Map();
      let noNumSeq = 100000; // penampung untuk file bertanda tapi tanpa angka
      tagged.forEach(t => {
        const key = t.num != null ? `n${t.num}` : `x${noNumSeq++}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(t);
      });
      const sortedKeys = [...groups.keys()].sort((a, b) => {
        const na = parseInt(a.slice(1), 10), nb = parseInt(b.slice(1), 10);
        return na - nb;
      });
      let itemIndex = 0;
      // Slot "ekstra" ini yang jadi kunci perbaikannya: kalau nomor yang sama
      // ternyata dipakai LEBIH dari satu foto pada SISI yang sama (misal dua
      // file sama-sama kena tag "before" dengan angka yang sama -- bisa
      // terjadi kalau angka di nama file sebenarnya bukan nomor urut temuan,
      // misal kebetulan sama-sama mengandung tanggal/jam), foto KEDUA dst.
      // dulunya langsung menimpa foto pertama di slot yang sama tanpa
      // pemberitahuan apa pun -- itulah kenapa jumlah foto yang akhirnya
      // muncul di Excel/HTML bisa jauh lebih sedikit dari jumlah yang
      // di-drag-drop. Sekarang foto yang "bentrok" itu TIDAK ditimpa,
      // melainkan dipisah jadi temuan baru tersendiri di akhir daftar --
      // supaya tidak ada satu pun foto yang hilang diam-diam.
      let nextExtraIndex = sortedKeys.length;
      sortedKeys.forEach(key => {
        const usedSides = new Set();
        groups.get(key).forEach(t => {
          const side = t.side || 'before';
          if (usedSides.has(side)) {
            plan.push({ file: t.file, itemIndex: nextExtraIndex, side });
            nextExtraIndex++;
            dupRescued++;
          } else {
            usedSides.add(side);
            plan.push({ file: t.file, itemIndex, side });
          }
        });
        itemIndex++;
      });
    } else {
      // Mode berurutan: semua jadi foto Temuan, satu foto per temuan
      tagged.forEach((t, i) => plan.push({ file: t.file, itemIndex: i, side: 'before' }));
    }

    // Siapkan temuan sesuai kebutuhan: pakai yang slotnya masih kosong dulu,
    // baru buat temuan baru kalau kurang.
    const needed = Math.max(...plan.map(p => p.itemIndex)) + 1;
    const targetIds = [];
    const existing = getItems(sid);
    existing.forEach(card => {
      const cid = card.dataset.id;
      if (!storeData[cid].beforeOrig && !storeData[cid].afterOrig) targetIds.push(cid);
    });
    while (targetIds.length < needed) targetIds.push(addItem(sid, {}, { silent: true }));

    showLoading(`Memproses 0 dari ${plan.length} foto...`);
    let done = 0;
    const next = () => {
      if (done >= plan.length) {
        hideLoading();
        renumberSheets();
        scheduleSave();
        const pasanganCount = needed - dupRescued;
        const pairs = hasTag ? ` (${pasanganCount} temuan berpasangan)` : '';
        if (dupRescued > 0) {
          // Beri tahu SECARA EKSPLISIT kalau ada tabrakan nomor -- supaya user
          // tahu ada beberapa foto yang otomatis dipisah ke temuan baru
          // (bukan berpasangan), dan bisa mengecek/menata ulang manual kalau perlu.
          showToast('info', 'Ada foto dengan nomor pasangan yang sama',
            `${dupRescued} foto punya nomor pasangan & sisi (before/after) yang sama dengan foto lain -- `
            + `supaya tidak ada yang tertimpa/hilang, foto-foto itu dipisah jadi ${dupRescued} temuan baru tersendiri `
            + `di bagian akhir. Cek dan tata ulang manual kalau perlu.`, 9000);
        }
        showToast('success', 'Foto ditambahkan', `${plan.length} foto masuk ke sheet ini${pairs}.`, 4500);
        return;
      }
      updateLoading(`Memproses ${done + 1} dari ${plan.length} foto...`);
      const p = plan[done];
      handleFile(p.file, targetIds[p.itemIndex], p.side, () => { done++; next(); });
    };
    next();
  }

  // ================= DRAG & DROP PER SLOT =================
  let lastActiveDrop = null;

  function initDragDrop(id, side) {
    const dz = document.getElementById(`dz-${side}-${id}`);
    ['dragenter', 'dragover'].forEach(evt => dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach(evt => dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.remove('dragover'); }));

    dz.addEventListener('drop', e => {
      const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
      if (!files.length) return;
      if (files.length > 1) {
        // Drop banyak file di satu slot -> file pertama masuk sini, sisanya
        // dilempar ke mesin upload massal supaya tetap terpasangkan rapi.
        const sid = sidOfItem(id);
        handleFile(files[0], id, side, () => handleBulkFiles(sid, files.slice(1)));
      } else {
        handleFile(files[0], id, side, () => { renumberSheets(); scheduleSave(); });
      }
    });

    const remember = () => { lastActiveDrop = { sid: sidOfItem(id), id, side }; };
    dz.addEventListener('focus', () => { remember(); dz.classList.add('paste-ready'); });
    dz.addEventListener('click', remember);
    dz.addEventListener('mouseenter', remember);
    dz.addEventListener('blur', () => dz.classList.remove('paste-ready'));
  }

  function fileChosen(e, id, side) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    if (files.length > 1) {
      const sid = sidOfItem(id);
      handleFile(files[0], id, side, () => handleBulkFiles(sid, files.slice(1)));
    } else {
      handleFile(files[0], id, side, () => { renumberSheets(); scheduleSave(); });
    }
    e.target.value = '';
  }

  // Ctrl+V di mana saja -> masuk ke slot terakhir yang disentuh, atau slot
  // kosong pertama di sheet yang sedang aktif.
  document.addEventListener('paste', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    const items = (e.clipboardData || window.clipboardData)?.items;
    if (!items) return;
    const imgs = [];
    for (const it of items) {
      if (it.type.indexOf('image/') === 0) { const f = it.getAsFile(); if (f) imgs.push(f); }
    }
    if (!imgs.length) return;
    e.preventDefault();

    const sheets = getSheets();
    if (!sheets.length) return;
    let sid = activeSid;
    if (!document.getElementById(`sheet-${sid}`)) sid = sheets[0].dataset.sid;

    if (imgs.length > 1) { handleBulkFiles(sid, imgs); return; }

    let target = (lastActiveDrop && lastActiveDrop.id
      && document.getElementById(`card-${lastActiveDrop.id}`)
      && String(lastActiveDrop.sid) === String(sid)) ? lastActiveDrop : null;

    if (!target) {
      for (const card of getItems(sid)) {
        const cid = card.dataset.id;
        if (!storeData[cid].beforeOrig) { target = { id: cid, side: 'before' }; break; }
        if (!storeData[cid].afterOrig)  { target = { id: cid, side: 'after'  }; break; }
      }
    }
    if (!target) target = { id: addItem(sid, {}, { silent: true }), side: 'before' };

    handleFile(imgs[0], target.id, target.side, () => {
      renumberSheets(); scheduleSave();
      const card = document.getElementById(`card-${target.id}`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    showToast('info', 'Foto ditempel', `Masuk ke foto ${target.side === 'before' ? 'Temuan' : 'Perbaikan'}.`, 2500);
  });

  // ================= EXIF ORIENTATION =================
  // Foto HP/kamera menyimpan tag EXIF "Orientation". Browser menerapkannya
  // otomatis saat menampilkan <img>, tapi Excel MENGABAIKANNYA -> foto tampil
  // terputar di .xlsx. Solusinya: "bakar" orientasi ke piksel lewat canvas.
  function getExifOrientation(arrayBuffer) {
    try {
      const view = new DataView(arrayBuffer);
      if (view.getUint16(0, false) !== 0xFFD8) return 1;
      const length = view.byteLength;
      let offset = 2;
      while (offset < length - 1) {
        const marker = view.getUint16(offset, false);
        offset += 2;
        if (marker === 0xFFE1) {
          if (view.getUint32(offset + 2, false) !== 0x45786966) return 1;
          const tiff = offset + 8;
          const little = view.getUint16(tiff, false) === 0x4949;
          const firstIFD = view.getUint32(tiff + 4, little);
          const tags = view.getUint16(tiff + firstIFD, little);
          for (let i = 0; i < tags; i++) {
            const entry = tiff + firstIFD + 2 + i * 12;
            if (view.getUint16(entry, little) === 0x0112) return view.getUint16(entry + 8, little);
          }
          return 1;
        } else if ((marker & 0xFF00) !== 0xFF00) break;
        else offset += view.getUint16(offset, false);
      }
    } catch (e) { /* abaikan */ }
    return 1;
  }

  // ================= KOMPRESI =================
  // PNG itu lossless -> foto 2 MB bisa membengkak jadi belasan MB di Excel.
  // Jadi hasil canvas selalu di-export sebagai JPEG + di-downscale sesuai preset.
  function canvasToOptimized(canvas) {
    const preset = currentQuality();
    const longest = Math.max(canvas.width, canvas.height);
    const scale = longest > preset.dim ? (preset.dim / longest) : 1;

    const out = document.createElement('canvas');
    out.width  = Math.max(1, Math.round(canvas.width  * scale));
    out.height = Math.max(1, Math.round(canvas.height * scale));
    const ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#FFFFFF';   // JPEG tidak punya alpha
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(canvas, 0, 0, out.width, out.height);

    return { base64: out.toDataURL('image/jpeg', preset.q), w: out.width, h: out.height };
  }
  function base64Bytes(dataUrl) {
    const b64 = (dataUrl.split(',')[1] || '');
    return Math.round(b64.length * 3 / 4);
  }

  function bakeOrientation(img, orientation) {
    const swap = orientation >= 5 && orientation <= 8;
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    const canvas = document.createElement('canvas');
    canvas.width  = swap ? h : w;
    canvas.height = swap ? w : h;
    const ctx = canvas.getContext('2d');
    switch (orientation) {
      case 2: ctx.transform(-1, 0, 0, 1, w, 0); break;
      case 3: ctx.transform(-1, 0, 0, -1, w, h); break;
      case 4: ctx.transform(1, 0, 0, -1, 0, h); break;
      case 5: ctx.transform(0, 1, 1, 0, 0, 0); break;
      case 6: ctx.transform(0, 1, -1, 0, h, 0); break;
      case 7: ctx.transform(0, -1, -1, 0, h, w); break;
      case 8: ctx.transform(0, -1, 1, 0, 0, w); break;
      default: ctx.transform(1, 0, 0, 1, 0, 0);
    }
    ctx.drawImage(img, 0, 0);
    return canvasToOptimized(canvas);
  }

  function handleFile(file, id, side, done) {
    const finish = () => { if (typeof done === 'function') done(); };
    if (!file || !file.type.startsWith('image/')) {
      showToast('error', 'File tidak valid', 'Hanya file gambar yang bisa diupload.', 3000);
      finish(); return;
    }
    if (!storeData[id]) { finish(); return; }

    const bufReader = new FileReader();
    bufReader.onload = ev => {
      const orientation = getExifOrientation(ev.target.result);
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = function() {
          const baked = bakeOrientation(img, orientation);
          storeData[id][side + 'Orig'] = baked.base64;
          storeData[id][side + 'Rot']  = 0;
          // Foto diganti -> anotasi lama tidak relevan lagi, dikosongkan
          storeData[id][side + 'Ann']  = [];
          storeData[id][side + 'Stamp'] = null;
          storeData[id][side + 'Img']  = baked.base64;
          storeData[id][side + 'W']    = baked.w;
          storeData[id][side + 'H']    = baked.h;

          const prev = document.getElementById(`prev-${side}-${id}`);
          if (prev) prev.src = baked.base64;
          const wrap = document.getElementById(`wrap-${side}-${id}`);
          if (wrap) wrap.style.display = 'inline-block';
          annUpdateBadge(id, side);

          scheduleSave();
          finish();
        };
        img.onerror = () => { showToast('error', 'Gagal membaca gambar', 'File rusak atau format tidak didukung.', 3500); finish(); };
        img.src = e.target.result;
      };
      reader.onerror = () => { showToast('error', 'Gagal membaca file', '', 3000); finish(); };
      reader.readAsDataURL(file);
    };
    bufReader.onerror = () => { showToast('error', 'Gagal membaca file', '', 3000); finish(); };
    bufReader.readAsArrayBuffer(file);
  }

  // ================= ROTASI =================
  // Selalu render ULANG dari <side>Orig memakai sudut kumulatif, bukan dari
  // hasil rotasi sebelumnya -- supaya muter berkali-kali tidak menumpuk
  // artefak JPEG dan menurunkan kualitas foto.
  // Susun hasil akhir foto = SUMBER + rotasi + anotasi.
  // Selalu dirender ULANG dari <side>Orig, bukan dari hasil sebelumnya, supaya
  // muter berkali-kali atau mengubah anotasi tidak menumpuk artefak JPEG.
  //
  // Namanya dulu renderRotation(); diganti jadi renderComposite() karena
  // sekarang tugasnya bukan cuma rotasi.
  function renderComposite(id, side) {
    const d = storeData[id];
    if (!d || !d[side + 'Orig']) return;

    const angle = ((d[side + 'Rot'] % 360) + 360) % 360;
    const ann = d[side + 'Ann'] || [];
    const stamp = d[side + 'Stamp'];
    const src = d[side + 'Orig'];

    const img = new Image();
    img.onload = function() {
      // Tidak diputar & tidak ada anotasi -> pakai sumber apa adanya,
      // tanpa encode ulang sama sekali (kualitas foto tetap utuh).
      if (angle === 0 && ann.length === 0 && !stamp) {
        d[side + 'Img'] = src;
        d[side + 'W'] = img.naturalWidth || img.width;
        d[side + 'H'] = img.naturalHeight || img.height;
        const prev0 = document.getElementById(`prev-${side}-${id}`);
        if (prev0) prev0.src = src;
        const wrap0 = document.getElementById(`wrap-${side}-${id}`);
        if (wrap0) wrap0.style.display = 'inline-block';
        annUpdateBadge(id, side);
        scheduleSave();
        return;
      }

      const w = img.naturalWidth || img.width;
      const h = img.naturalHeight || img.height;
      const swap = (angle === 90 || angle === 270);

      const canvas = document.createElement('canvas');
      canvas.width  = swap ? h : w;
      canvas.height = swap ? w : h;
      const ctx = canvas.getContext('2d');

      // Langkah 1: gambar fotonya dengan rotasi yang diminta
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(angle * Math.PI / 180);
      ctx.drawImage(img, -w / 2, -h / 2);
      ctx.restore();

      // Langkah 2: tempel anotasi DI ATAS foto yang sudah diputar.
      // Koordinat anotasi memang sudah relatif terhadap tampilan setelah
      // rotasi (lihat rotateBy), jadi di sini tinggal digambar apa adanya.
      ann.forEach(a => annDrawShape(ctx, a, canvas.width, canvas.height));
      if (stamp && stamp.enabled !== false) joStampDraw(ctx, canvas.width, canvas.height, stamp);

      const out = canvasToOptimized(canvas);
      d[side + 'Img'] = out.base64;
      d[side + 'W'] = out.w;
      d[side + 'H'] = out.h;

      const prev = document.getElementById(`prev-${side}-${id}`);
      if (prev) prev.src = out.base64;
      const wrap = document.getElementById(`wrap-${side}-${id}`);
      if (wrap) wrap.style.display = 'inline-block';
      annUpdateBadge(id, side);
      scheduleSave();
    };
    img.onerror = () => showToast('error', 'Gagal memproses foto', '', 3000);
    img.src = src;
  }

  // Nama lama dipertahankan sebagai alias, supaya pemanggilan yang sudah ada
  // (pemulihan draft, dll.) tidak perlu diubah semua.
  function renderRotation(id, side) { renderComposite(id, side); }

  // Penanda kecil di pojok preview: berapa anotasi yang menempel di foto ini
  function annUpdateBadge(id, side) {
    const el = document.getElementById(`annbadge-${side}-${id}`);
    if (!el) return;
    const n = ((storeData[id] || {})[side + 'Ann'] || []).length;
    el.textContent = n ? `✏️ ${n}` : '';
    el.classList.toggle('show', n > 0);
  }

  function rotateBy(id, side, delta) {
    const d = storeData[id];
    if (!d || !d[side + 'Orig']) return;
    d[side + 'Rot'] = (((d[side + 'Rot'] + delta) % 360) + 360) % 360;
    // Anotasi ikut diputar dengan sudut yang sama, jadi panah/lingkaran tetap
    // menempel di objek yang ditunjuk -- bukan melayang ke tempat lain.
    if ((d[side + 'Ann'] || []).length) {
      d[side + 'Ann'] = annRotateAll(d[side + 'Ann'], ((delta % 360) + 360) % 360);
    }
    renderComposite(id, side);
  }
  function resetRotation(id, side) {
    const d = storeData[id];
    if (!d || !d[side + 'Orig']) return;
    if (d[side + 'Rot'] === 0) { showToast('info', 'Sudah di posisi asli', '', 2000); return; }
    // Anotasi diputar balik sebanyak sudut yang sedang aktif, supaya posisinya
    // tetap sinkron dengan foto yang kembali ke orientasi asli.
    const balik = (360 - (((d[side + 'Rot'] % 360) + 360) % 360)) % 360;
    if ((d[side + 'Ann'] || []).length) {
      d[side + 'Ann'] = annRotateAll(d[side + 'Ann'], balik);
    }
    d[side + 'Rot'] = 0;
    renderComposite(id, side);
    showToast('info', 'Rotasi direset', 'Foto dikembalikan ke orientasi aslinya.', 2500);
  }

  async function reapplyQualityAll() {
    const ids = Object.keys(storeData).filter(id => storeData[id] && (storeData[id].beforeOrig || storeData[id].afterOrig));
    if (!ids.length) { showToast('info', 'Belum ada foto', '', 2500); return; }
    const p = currentQuality();
    if (!confirm(`Proses ulang semua foto ke kualitas "${p.name}" (${p.dim}px, ${Math.round(p.q * 100)}%)?\n\nMenaikkan kualitas tidak mengembalikan detail yang sudah hilang.`)) return;

    showLoading('Memproses ulang foto...');
    let n = 0, before = 0, after = 0;
    const reprocess = (b64) => new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth || img.width;
        c.height = img.naturalHeight || img.height;
        c.getContext('2d').drawImage(img, 0, 0);
        resolve(canvasToOptimized(c).base64);
      };
      img.onerror = () => resolve(b64);
      img.src = b64;
    });

    for (const id of ids) {
      for (const side of ['before', 'after']) {
        const orig = storeData[id][side + 'Orig'];
        if (!orig) continue;
        n++;
        updateLoading(`Memproses ulang foto ${n}...`);
        before += base64Bytes(orig);
        const out = await reprocess(orig);
        after += base64Bytes(out);
        storeData[id][side + 'Orig'] = out;
        // renderComposite menggambar ulang anotasi di atas foto yang baru
        // diproses, jadi anotasi tetap tajam & posisinya tidak bergeser.
        renderComposite(id, side);
      }
    }
    hideLoading();
    scheduleSave();
    const mb = x => (x / 1024 / 1024).toFixed(2);
    showToast('success', 'Kualitas diterapkan', `${n} foto diproses ulang. Total ${mb(before)} MB → ${mb(after)} MB.`, 6000);
  }

  function annRotateCurrent(delta) {
    if (!annCur) return;
    annTextCommitIfOpen();
    const angle = ((delta % 360) + 360) % 360;
    if (!angle) return;
    const current = annCur;
    const w = current.img.naturalWidth || current.img.width;
    const h = current.img.naturalHeight || current.img.height;
    const swap = angle === 90 || angle === 270;
    const canvas = document.createElement('canvas');
    canvas.width = swap ? h : w;
    canvas.height = swap ? w : h;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(angle * Math.PI / 180);
    ctx.drawImage(current.img, -w / 2, -h / 2);
    current.ann = annRotateAll(current.ann, angle);
    current.rot = ((current.rot + angle) % 360);
    current.cropRect = null;
    current.cropDrag = null;
    current.img = new Image();
    current.img.onload = function () {
      if (annCur !== current) return;
      current.W = canvas.width;
      current.H = canvas.height;
      const cv = document.getElementById('annCanvas');
      cv.width = current.W;
      cv.height = current.H;
      const stage = document.querySelector('.ann-stage');
      current.fitZoom = Math.min((stage.clientWidth - 32) / current.W, (stage.clientHeight - 32) / current.H, 1);
      current.zoom = current.fitZoom;
      annApplyZoom();
      annDraw();
    };
    current.img.src = canvas.toDataURL('image/jpeg', 0.96);
  }

  // ================= EDITOR ANOTASI FOTO =================
  // Anotasi disimpan sebagai VEKTOR dengan koordinat NORMALISASI (0..1),
  // bukan langsung dibakar ke piksel. Alasannya:
  //   - bisa dihapus / diubah kapan saja, tidak permanen
  //   - tidak menumpuk encode JPEG (kalau dibakar tiap simpan, kualitas foto
  //     turun sedikit demi sedikit seperti masalah rotasi dulu)
  //   - posisi tetap benar walau foto diputar atau kualitasnya diganti
  //   - hemat ukuran draft (beberapa byte vs foto ratusan KB)
  //
  // Bentuk satu anotasi:
  //   { t: 'arrow'|'rect'|'ellipse'|'line'|'free'|'text',
  //     c: warna, w: tebal (1|2|3),
  //     x1,y1,x2,y2 : titik awal & akhir (0..1)
  //     pts: [[x,y],...] untuk coretan bebas
  //     txt: isi teks }
  const ANN_COLORS = ['#dc2626', '#eab308', '#16a34a', '#2563eb', '#ffffff', '#000000'];
  const ANN_TOOLS = ['arrow', 'rect', 'ellipse', 'line', 'free', 'text', 'eraser', 'crop', 'move'];

  let annCur = null;   // { id, side, ann[], redo[], tool, color, width, img, W, H }
  let annDrag = null;  // gambar yang sedang ditarik
  let annMoveDrag = null;  // { index, startX, startY, before } -- anotasi yang sedang digeser (alat Pindah)
  let annLastTextTap = null;

  function annOpen(id, side) {
    const d = storeData[id];
    if (!d || !d[side + 'Orig']) {
      showToast('info', 'Belum ada foto', 'Upload fotonya dulu sebelum memberi anotasi.', 3000);
      return;
    }

    // Kanvas memakai foto yang SUDAH dirotasi, supaya yang digambar user
    // persis sama dengan yang dilihatnya di preview & hasil Excel.
    annRenderRotatedSource(id, side, (img) => {
      annCur = {
        id, side,
        ann: (d[side + 'Ann'] || []).map(a => Object.assign({}, a)),  // salinan, biar Batal benar-benar batal
        stamp: d[side + 'Stamp'] ? Object.assign({}, d[side + 'Stamp']) : null,
        rot: d[side + 'Rot'] || 0,
        undoStack: [], redoStack: [],
        tool: 'arrow', color: ANN_COLORS[0], width: 2,
        img, W: img.width, H: img.height,
        cropRect: null, cropDrag: null, cropApplied: false,
 eraseMode: 'object', eraserSize: 36, eraserBefore: null,
        zoom: 1, fitZoom: 1, textEditing: false, curTextBoxColor: null
      };
      annMoveDrag = null;

      const cv = document.getElementById('annCanvas');
      cv.width = img.width;
      cv.height = img.height;
      document.querySelector('.ann-stage').classList.remove('zoomed');

      // PENTING: modal ditampilkan (class "active") SEBELUM menghitung ukuran
      // stage. Sebelumnya class ini baru ditambahkan di akhir fungsi --
      // padahal selama modal masih display:none, clientWidth/clientHeight
      // stage selalu 0, sehingga skala "fit" ikut salah hitung (bisa negatif)
      // dan foto tampil gepeng/kacau -- terutama untuk foto KEDUA dst. yang
      // dibuka setelah modal sempat ditutup lalu dibuka lagi.
      document.getElementById('annModal').classList.add('active');
      document.body.style.overflow = 'hidden';

      document.getElementById('annTitle').textContent =
        side === 'before' ? 'Anotasi Foto Temuan' : 'Anotasi Foto Perbaikan';
      // Form (b) tidak punya field judul seperti form (c); yang paling
      // menjelaskan konteks foto adalah Area/Description-nya.
      const areaEl = document.getElementById(`area-${id}`);
      annCur.subText = (areaEl && areaEl.value) ? areaEl.value : 'Tandai bagian yang ingin ditunjuk';
      document.getElementById('annSub').textContent = annCur.subText;

      annSetTool('arrow');
      annSetColor(ANN_COLORS[0]);
      annSetWidth(2);
    annSyncEraserControls();

      // Skala "fit": muat penuh di layar tanpa perlu digulir -- jadi titik awal
      // zoom. Tombol +/- atau Ctrl+Scroll bisa memperbesar melebihi ini.
      // Dihitung SETELAH modal benar-benar tampil (lihat catatan di atas).
      const stage = document.querySelector('.ann-stage');
      const maxW = stage.clientWidth - 32;
      const maxH = stage.clientHeight - 32;
      const sc = Math.min(maxW / img.width, maxH / img.height, 1);
      annCur.fitZoom = sc;
      annCur.zoom = sc;
      annApplyZoom();

      const cropGroupEl = document.getElementById('annCropGroup');
      if (cropGroupEl) cropGroupEl.style.display = 'none';
      const cropApplyEl = document.getElementById('annCropApply');
      if (cropApplyEl) cropApplyEl.disabled = true;

      annDraw();
      if (window.joStampSyncControls) window.joStampSyncControls();
    });
  }


  // Siapkan gambar sumber untuk kanvas: foto asli + rotasi (tanpa anotasi)
  function annRenderRotatedSource(id, side, cb) {
    const d = storeData[id];
    const angle = ((d[side + 'Rot'] % 360) + 360) % 360;
    const img = new Image();
    img.onload = function() {
      if (angle === 0) { cb(img); return; }
      const w = img.naturalWidth || img.width;
      const h = img.naturalHeight || img.height;
      const swap = (angle === 90 || angle === 270);
      const c = document.createElement('canvas');
      c.width = swap ? h : w;
      c.height = swap ? w : h;
      const ctx = c.getContext('2d');
      ctx.translate(c.width / 2, c.height / 2);
      ctx.rotate(angle * Math.PI / 180);
      ctx.drawImage(img, -w / 2, -h / 2);
      const out = new Image();
      out.onload = () => cb(out);
      out.src = c.toDataURL('image/jpeg', 0.92);
    };
    img.onerror = () => showToast('error', 'Gagal membuka foto', '', 3000);
    img.src = d[side + 'Orig'];
  }

  function annSetTool(t) {
    if (!annCur) return;
    if (annCur.textEditing && t !== 'text') annTextCommitIfOpen();
    annCur.tool = t;
    ANN_TOOLS.forEach(x => {
      const el = document.getElementById('annTool-' + x);
      if (el) el.classList.toggle('active', x === t);
    });
    document.getElementById('annCanvas').style.cursor = (t === 'text') ? 'text' : (t === 'move' ? 'move' : (t === 'eraser' ? 'none' : 'crosshair'));
    const eraserOptions = document.getElementById('annEraserOptions');
    if (eraserOptions) eraserOptions.style.display = t === 'eraser' ? 'flex' : 'none';
    const eraserTarget = document.getElementById('annEraserTarget');
    if (eraserTarget && t !== 'eraser') eraserTarget.style.display = 'none';
    annMoveDrag = null;  // pindah alat di tengah proses geser -- batalkan geseran yang belum selesai

    // Mode Crop: tampilkan tombol Terapkan/Batal, dan ganti subjudul jadi
    // instruksi cara memilih area. Meninggalkan mode ini membuang pilihan
    // crop yang belum diterapkan (belum menyentuh storeData sama sekali).
    const cropGroup = document.getElementById('annCropGroup');
    const subEl = document.getElementById('annSub');
    if (t === 'crop') {
      if (cropGroup) cropGroup.style.display = 'flex';
      if (subEl) subEl.textContent = 'Seret pada foto untuk memilih area yang ingin dipotong, lalu klik "Terapkan Crop"';
    } else {
      if (cropGroup) cropGroup.style.display = 'none';
      if (subEl && annCur.subText != null) subEl.textContent = annCur.subText;
      annCur.cropRect = null;
      annCur.cropDrag = null;
    }
    annDraw();
  }

  function annSetColor(c) {
    if (!annCur) return;
    if (annCur.textEditing) annTextSetColor(c);
    annCur.color = c;
    ANN_COLORS.forEach(x => {
      const el = document.getElementById('annCol-' + x);
      if (el) el.classList.toggle('active', x === c);
    });
    const spectrum = document.getElementById('annColorSpectrum');
    if (spectrum) {
      spectrum.parentElement.classList.toggle('active', ANN_COLORS.indexOf(c) === -1);
      if (spectrum.value.toLowerCase() !== c.toLowerCase()) spectrum.value = c;
    }
  }

  function annSetWidth(w) {
    if (!annCur) return;
    annCur.width = w;
    [1, 2, 3].forEach(x => {
      const el = document.getElementById('annW-' + x);
      if (el) el.classList.toggle('active', x === w);
    });
  }

  // Tebal garis dibuat relatif terhadap ukuran foto, supaya di foto besar
  // maupun kecil ketebalannya terlihat sebanding (bukan tipis sekali di foto 2000px).
  function annStroke(w, imgW) {
    return Math.max(2, Math.round((imgW / 320) * w));
  }

  // ---------- ALAT PINDAH: cari & geser anotasi yang sudah ada ----------
  // Jarak titik ke segmen garis (dipakai untuk hit-test panah & garis lurus,
  // yang tipis dan sulit "kena" kalau cuma dicek terhadap kotak pembatasnya).
  function annDistToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq ? ((px - x1) * dx + (py - y1) * dy) / lenSq : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return Math.hypot(px - cx, py - cy);
  }

  // Cek apakah titik (px,py -- dalam koordinat 0..1) "mengenai" satu anotasi.
  // Tiap jenis punya cara hit-test sendiri, karena bentuknya beda-beda:
  //   - teks (richtext/text lama): kotak persis dari _lastBox (diisi saat render)
  //   - panah/garis: jarak ke garisnya, karena bentuknya tipis
  //   - kotak/lingkaran/coretan bebas: kotak pembatas (bounding box), dengan
  //     sedikit bantalan supaya gampang "kena" walau klik sedikit meleset
  function annHitTestShape(a, px, py, W, H) {
    const pad = 0.018;
    if ((a.t === 'richtext' || a.t === 'text') && a._lastBox) {
      const b = a._lastBox;
      return px >= b.x - pad && px <= b.x + b.w + pad && py >= b.y - pad && py <= b.y + b.h + pad;
    }
    if (a.t === 'arrow' || a.t === 'line') {
      const d = annDistToSegment(px * W, py * H, a.x1 * W, a.y1 * H, a.x2 * W, a.y2 * H);
      return d <= Math.max(16, annStroke(a.w || 2, W) * 3);
    }
    if (a.t === 'rect' || a.t === 'ellipse') {
      const x1 = Math.min(a.x1, a.x2) - pad, x2 = Math.max(a.x1, a.x2) + pad;
      const y1 = Math.min(a.y1, a.y2) - pad, y2 = Math.max(a.y1, a.y2) + pad;
      return px >= x1 && px <= x2 && py >= y1 && py <= y2;
    }
    if (a.t === 'free' && a.pts && a.pts.length) {
      let minx = 1, maxx = 0, miny = 1, maxy = 0;
      a.pts.forEach(([x, y]) => {
        minx = Math.min(minx, x); maxx = Math.max(maxx, x);
        miny = Math.min(miny, y); maxy = Math.max(maxy, y);
      });
      return px >= minx - pad && px <= maxx + pad && py >= miny - pad && py <= maxy + pad;
    }
    return false;
  }

  // Cari anotasi TERATAS (paling akhir digambar = paling atas secara visual)
  // yang kena di titik ini -- supaya kalau ada tumpang tindih, yang diambil
  // untuk digeser adalah yang benar-benar terlihat mata di posisi itu.
  function annFindShapeAt(px, py) {
    if (!annCur) return -1;
    for (let i = annCur.ann.length - 1; i >= 0; i--) {
      if (annHitTestShape(annCur.ann[i], px, py, annCur.W, annCur.H)) return i;
    }
    return -1;
  }
  function annEraserPathTouches(points, p, radius, rect) {
    if (!points || !points.length) return false;
    const px = p.x * rect.width, py = p.y * rect.height;
    if (points.length === 1) return Math.hypot(points[0][0] * rect.width - px, points[0][1] * rect.height - py) <= radius;
    for (let i = 1; i < points.length; i++) {
      if (annDistToSegment(px, py, points[i - 1][0] * rect.width, points[i - 1][1] * rect.height,
          points[i][0] * rect.width, points[i][1] * rect.height) <= radius) return true;
    }
    return false;
  }

  function annEraserShapeTouches(shape, p, radius, rect) {
    if ((shape.t === 'richtext' || shape.t === 'text') && shape._lastBox) {
      const b = shape._lastBox, px = p.x * rect.width, py = p.y * rect.height;
      const left = b.x * rect.width, top = b.y * rect.height;
      const dx = Math.max(left - px, 0, px - (left + b.w * rect.width));
      const dy = Math.max(top - py, 0, py - (top + b.h * rect.height));
      return dx * dx + dy * dy <= radius * radius;
    }
    let points = [];
    if (shape.t === 'free') points = shape.pts || [];
    else if (shape.t === 'arrow' || shape.t === 'line') points = [[shape.x1, shape.y1], [shape.x2, shape.y2]];
    else if (shape.t === 'rect') points = [[shape.x1, shape.y1], [shape.x2, shape.y1], [shape.x2, shape.y2], [shape.x1, shape.y2], [shape.x1, shape.y1]];
    else if (shape.t === 'ellipse') {
      const cx = (shape.x1 + shape.x2) / 2, cy = (shape.y1 + shape.y2) / 2;
      const rx = Math.abs(shape.x2 - shape.x1) / 2, ry = Math.abs(shape.y2 - shape.y1) / 2;
      for (let i = 0; i <= 48; i++) { const a = i * Math.PI * 2 / 48; points.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
    }
    return annEraserPathTouches(points, p, radius, rect);
  }

  function annEraserCutFree(shape, p, radius, rect) {
    const points = shape.pts || [], parts = [];
    if (!points.length) return { hit: false, parts };
    const px = p.x * rect.width, py = p.y * rect.height;
    const inside = q => Math.hypot(q[0] * rect.width - px, q[1] * rect.height - py) <= radius;
    if (points.length === 1) return { hit: inside(points[0]), parts };
    let hit = false, part = [];
    const push = q => {
      if (inside(q)) {
        hit = true;
        if (part.length > 1) parts.push(part);
        part = [];
      } else {
        const last = part[part.length - 1];
        if (!last || Math.hypot((q[0] - last[0]) * rect.width, (q[1] - last[1]) * rect.height) > 0.5) part.push(q);
      }
    };
    for (let i = 1; i < points.length; i++) {
      const a = points[i - 1], b = points[i];
      const length = Math.hypot((b[0] - a[0]) * rect.width, (b[1] - a[1]) * rect.height);
      const steps = Math.max(1, Math.ceil(length / Math.max(2, radius * 0.35)));
      for (let j = (i === 1 ? 0 : 1); j <= steps; j++) {
        const t = j / steps;
        push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
      }
    }
    if (part.length > 1) parts.push(part);
    return { hit, parts };
  }

  function annEraseAt(p) {
    if (!annCur) return false;
    const cv = document.getElementById('annCanvas'), rect = cv.getBoundingClientRect();
    const radius = Math.max(4, +annCur.eraserSize || 36) / 2;
    let changed = false;
    for (let i = annCur.ann.length - 1; i >= 0; i--) {
      const shape = annCur.ann[i];
      if (annCur.eraseMode === 'manual' && shape.t === 'free') {
        const cut = annEraserCutFree(shape, p, radius, rect);
        if (!cut.hit) continue;
        const replacements = cut.parts.map(pts => Object.assign({}, shape, { pts }));
        annCur.ann.splice(i, 1, ...replacements);
        changed = true;
      } else if (annEraserShapeTouches(shape, p, radius, rect)) {
        annCur.ann.splice(i, 1);
        changed = true;
      }
    }
    if (changed) annDraw();
    return changed;
  }

  function annUpdateEraserTarget(e) {
    const target = document.getElementById('annEraserTarget');
    const cv = document.getElementById('annCanvas');
    if (!target || !cv) return;
    if (!annCur || annCur.tool !== 'eraser' || !e) { target.style.display = 'none'; return; }
    const rect = cv.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (x < 0 || y < 0 || x > rect.width || y > rect.height) { target.style.display = 'none'; return; }
    const size = Math.max(8, +annCur.eraserSize || 36);
    target.style.width = size + 'px'; target.style.height = size + 'px';
    target.style.left = x + 'px'; target.style.top = y + 'px'; target.style.display = 'block';
  }

  function annSyncEraserControls() {
    if (!annCur) return;
    const mode = document.getElementById('annEraserMode'), size = document.getElementById('annEraserSize');
    const label = document.getElementById('annEraserSizeLabel');
    if (mode) mode.value = annCur.eraseMode || 'object';
    if (size) size.value = annCur.eraserSize || 36;
    if (label) label.textContent = (annCur.eraserSize || 36) + ' px';
  }
  function annSetEraserMode(mode) {
    if (!annCur) return;
    annCur.eraseMode = mode === 'manual' ? 'manual' : 'object';
  }
  function annSetEraserSize(size) {
    if (!annCur) return;
    annCur.eraserSize = Math.max(8, Math.min(64, +size || 36));
    const label = document.getElementById('annEraserSizeLabel');
    if (label) label.textContent = annCur.eraserSize + ' px';
    const target = document.getElementById('annEraserTarget');
    if (target) { target.style.width = annCur.eraserSize + 'px'; target.style.height = annCur.eraserSize + 'px'; }
  }

  // Geser SATU anotasi sebesar (dx,dy) -- dihitung dari salinan "before" yang
  // diambil di awal proses seret (annStart), bukan dari posisi terakhirnya
  // sendiri, supaya pergeserannya tetap presisi mengikuti kursor walau mouse
  // bergerak cepat/tersendat-sendat.
  function annApplyShapeOffset(shape, before, dx, dy) {
    if (!shape || !before) return;
    shape.x1 = before.x1 + dx;
    shape.y1 = before.y1 + dy;
    if (before.x2 != null) shape.x2 = before.x2 + dx;
    if (before.y2 != null) shape.y2 = before.y2 + dy;
    if (before.pts) shape.pts = before.pts.map(([x, y]) => [x + dx, y + dy]);
  }

  // ---------- MENGGAMBAR SATU ANOTASI ----------
  // Dipakai bersama oleh kanvas editor DAN hasil akhir yang masuk ke Excel,
  // jadi tampilannya dijamin identik.
  function annDrawShape(ctx, a, W, H) {
    if (a.t === 'richtext') { annDrawRichText(ctx, a, W, H); return; }
    const x1 = a.x1 * W, y1 = a.y1 * H;
    const x2 = (a.x2 != null ? a.x2 : a.x1) * W;
    const y2 = (a.y2 != null ? a.y2 : a.y1) * H;
    const lw = annStroke(a.w || 2, W);

    ctx.save();
    ctx.strokeStyle = a.c;
    ctx.fillStyle = a.c;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Garis putih tipis di belakang, supaya anotasi tetap terbaca
    // baik di area foto yang terang maupun yang gelap.
    const halo = () => {
      ctx.save();
      ctx.strokeStyle = (a.c === '#ffffff') ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.75)';
      ctx.lineWidth = lw + Math.max(2, lw * 0.8);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      return ctx;
    };

    if (a.t === 'arrow') {
      const head = Math.max(lw * 3.2, W * 0.022);
      const ang = Math.atan2(y2 - y1, x2 - x1);
      const drawArrow = (c) => {
        c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
        c.beginPath();
        c.moveTo(x2, y2);
        c.lineTo(x2 - head * Math.cos(ang - Math.PI / 7), y2 - head * Math.sin(ang - Math.PI / 7));
        c.lineTo(x2 - head * Math.cos(ang + Math.PI / 7), y2 - head * Math.sin(ang + Math.PI / 7));
        c.closePath();
        c.fill(); c.stroke();
      };
      const hc = halo(); hc.fillStyle = hc.strokeStyle; drawArrow(hc); ctx.restore();
      drawArrow(ctx);

    } else if (a.t === 'rect') {
      const hc = halo(); hc.strokeRect(x1, y1, x2 - x1, y2 - y1); ctx.restore();
      ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

    } else if (a.t === 'ellipse') {
      const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
      const rx = Math.abs(x2 - x1) / 2, ry = Math.abs(y2 - y1) / 2;
      const el = (c) => { c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); c.stroke(); };
      const hc = halo(); el(hc); ctx.restore();
      el(ctx);

    } else if (a.t === 'line') {
      const ln = (c) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); };
      const hc = halo(); ln(hc); ctx.restore();
      ln(ctx);

    } else if (a.t === 'free') {
      const pts = a.pts || [];
      if (pts.length > 1) {
        const fr = (c) => {
          c.beginPath();
          c.moveTo(pts[0][0] * W, pts[0][1] * H);
          for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0] * W, pts[i][1] * H);
          c.stroke();
        };
        const hc = halo(); fr(hc); ctx.restore();
        fr(ctx);
      }

    } else if (a.t === 'text') {
      const fs = Math.max(12, Math.round(W * 0.032 * (a.w || 2) / 2));
      ctx.font = `700 ${fs}px 'Segoe UI', Arial, sans-serif`;
      ctx.textBaseline = 'top';
      const lines = String(a.txt || '').split('\n');
      const pad = Math.round(fs * 0.3);
      let maxW = 0;
      lines.forEach(l => { maxW = Math.max(maxW, ctx.measureText(l).width); });
      const boxW = maxW + pad * 2;
      const boxH = lines.length * fs * 1.22 + pad * 2;

      // Jaga agar kotak teks tidak keluar dari tepi foto. Tanpa ini, teks yang
      // ditaruh dekat pinggir akan terpotong dan tidak terbaca di hasil Excel.
      const bx = Math.max(0, Math.min(x1 - pad, W - boxW));
      const by = Math.max(0, Math.min(y1 - pad, H - boxH));

      // Kotak latar supaya teks terbaca di atas foto apa pun
      ctx.fillStyle = (a.c === '#ffffff' || a.c === '#eab308') ? 'rgba(0,0,0,0.62)' : 'rgba(255,255,255,0.85)';
      ctx.fillRect(bx, by, boxW, boxH);

      ctx.fillStyle = a.c;
      lines.forEach((l, i) => ctx.fillText(l, bx + pad, by + pad + i * fs * 1.22));

      // Simpan posisi terakhir supaya alat Pindah bisa mendeteksi kotak ini,
      // sama seperti yang sudah dilakukan annDrawRichText untuk teks kaya.
      a._lastBox = { x: bx / W, y: by / H, w: boxW / W, h: boxH / H };
    }
    ctx.restore();
  }

  function annDraw() {
    if (!annCur) return;
    const cv = document.getElementById('annCanvas');
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(annCur.img, 0, 0, cv.width, cv.height);
    annCur.ann.forEach((a, i) => {
      if (i === annTextEditIndex && annCur.textEditing) return;  // sedang diedit lewat kotak HTML di atasnya
      annDrawShape(ctx, a, cv.width, cv.height);
    });
    if (annDrag) annDrawShape(ctx, annDrag, cv.width, cv.height);

    // Overlay pemilihan crop: area di luar kotak digelapkan, kotaknya sendiri
    // diberi garis putus-putus putih supaya jelas bagian mana yang dipotong.
    const cropSel = annCur.cropDrag || annCur.cropRect;
    if (cropSel) {
      const x1 = Math.min(cropSel.x1, cropSel.x2) * cv.width;
      const x2 = Math.max(cropSel.x1, cropSel.x2) * cv.width;
      const y1 = Math.min(cropSel.y1, cropSel.y2) * cv.height;
      const y2 = Math.max(cropSel.y1, cropSel.y2) * cv.height;
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, cv.width, y1);
      ctx.fillRect(0, y2, cv.width, cv.height - y2);
      ctx.fillRect(0, y1, x1, y2 - y1);
      ctx.fillRect(x2, y1, cv.width - x2, y2 - y1);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([7, 5]);
      ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
      ctx.restore();
    }

    const n = annCur.ann.length;
    if (cropSel) {
      const wpx = Math.round(Math.abs(cropSel.x2 - cropSel.x1) * annCur.W);
      const hpx = Math.round(Math.abs(cropSel.y2 - cropSel.y1) * annCur.H);
      document.getElementById('annCount').textContent = `Crop: ${wpx} x ${hpx} px`;
    } else {
      document.getElementById('annCount').textContent =
        n === 0 ? 'Belum ada anotasi' : `${n} anotasi`;
    }
    document.getElementById('annUndo').disabled = (annCur.undoStack.length === 0) || annCur.textEditing;
    document.getElementById('annRedo').disabled = (annCur.redoStack.length === 0) || annCur.textEditing;
    document.getElementById('annClear').disabled = (n === 0) || annCur.textEditing;
  }

  // ---------- INTERAKSI KANVAS ----------
  // Koordinat mouse/sentuhan diubah ke skala 0..1 supaya tidak bergantung
  // pada ukuran tampilan kanvas (yang menyesuaikan lebar layar).
  function annPos(e) {
    const cv = document.getElementById('annCanvas');
    const r = cv.getBoundingClientRect();
    const src = (e.touches && e.touches[0]) ? e.touches[0] : e;
    return {
      x: Math.min(1, Math.max(0, (src.clientX - r.left) / r.width)),
      y: Math.min(1, Math.max(0, (src.clientY - r.top) / r.height))
    };
  }

  function annStart(e) {
    if (!annCur) return;
    e.preventDefault();
    if (e.pointerId != null) document.getElementById('annCanvas').setPointerCapture(e.pointerId);
    if (e.touches && e.touches.length !== 1) {
      annDrag = null;
      annMoveDrag = null;
      return;
    }
    if (e.pointerType === 'touch' && e.isPrimary === false) {
      annDrag = null;
      annMoveDrag = null;
      if (annCur) annCur.cropDrag = null;
      return;
    }

    // Kalau ada kotak teks yang masih terbuka (dari klik sebelumnya), simpan
    // dulu otomatis sebelum memproses klik/gambar yang baru ini.
    if (annCur.textEditing) annTextCommitIfOpen();

    const p = annPos(e);
    if (annCur.tool === 'eraser') {
      annLastTextTap = null; annMoveDrag = null; annDrag = null;
      annCur.eraserBefore = JSON.parse(JSON.stringify(annCur.ann));
      annEraseAt(p); annUpdateEraserTarget(e);
      return;
    }

    if (annCur.tool !== 'crop') {
      const idx = annFindShapeAt(p.x, p.y);
      const shape = idx >= 0 ? annCur.ann[idx] : null;
      if (shape && (shape.t === 'richtext' || shape.t === 'text')) {
        const now = Date.now();
        if (annLastTextTap && annLastTextTap.index === idx &&
            now - annLastTextTap.time <= 450 &&
            Math.hypot(p.x - annLastTextTap.x, p.y - annLastTextTap.y) <= 0.04) {
          annLastTextTap = null;
          annMoveDrag = null;
          annTextOpen(p);
          return;
        }
        annLastTextTap = { index: idx, time: now, x: p.x, y: p.y };
        annMoveDrag = {
          index: idx, startX: p.x, startY: p.y,
          before: JSON.parse(JSON.stringify(shape)), textGesture: true, moved: false
        };
        return;
      }
    }

    if (annCur.tool === 'text') {
      annTextOpen(p);
      return;
    }

    if (annCur.tool === 'crop') {
      annCur.cropDrag = { x1: p.x, y1: p.y, x2: p.x, y2: p.y };
      annDraw();
      return;
    }

    if (annCur.tool === 'move') {
      const idx = annFindShapeAt(p.x, p.y);
      if (idx === -1) { annMoveDrag = null; return; }
      // "before" disimpan sebagai salinan MENDALAM (deep copy) supaya aman
      // dipakai sebagai snapshot Undo -- termasuk array pts/blocks di
      // dalamnya, yang kalau cuma di-assign biasa akan ikut berubah saat
      // shape aslinya digeser (referensi array yang sama).
      annMoveDrag = {
        index: idx,
        startX: p.x, startY: p.y,
        before: JSON.parse(JSON.stringify(annCur.ann[idx]))
      };
      return;
    }

    annDrag = {
      t: annCur.tool, c: annCur.color, w: annCur.width,
      x1: p.x, y1: p.y, x2: p.x, y2: p.y
    };
    if (annCur.tool === 'free') annDrag.pts = [[p.x, p.y]];
  }

  function annMove(e) {
    if (annCur) annUpdateEraserTarget(e);
    if (annCur && annCur.tool === 'eraser' && annCur.eraserBefore) {
      e.preventDefault(); annEraseAt(annPos(e)); return;
    }
    if (annCur && annCur.tool === 'crop' && annCur.cropDrag) {
      e.preventDefault();
      const p = annPos(e);
      annCur.cropDrag.x2 = p.x; annCur.cropDrag.y2 = p.y;
      annDraw();
      return;
    }
    if (annCur && annMoveDrag && (annCur.tool === 'move' || annMoveDrag.textGesture)) {
      const p = annPos(e);
      const dx = p.x - annMoveDrag.startX, dy = p.y - annMoveDrag.startY;
      const cv = document.getElementById('annCanvas');
      if (annMoveDrag.textGesture && !annMoveDrag.moved &&
          Math.hypot(dx * cv.clientWidth, dy * cv.clientHeight) < 6) return;
      annMoveDrag.moved = true;
      e.preventDefault();
      annApplyShapeOffset(annCur.ann[annMoveDrag.index], annMoveDrag.before, dx, dy);
      annDraw();
      return;
    }

    if (!annDrag) return;
    e.preventDefault();
    const p = annPos(e);
    annDrag.x2 = p.x; annDrag.y2 = p.y;
    if (annDrag.t === 'free') annDrag.pts.push([p.x, p.y]);
    annDraw();
  }

  function annEnd(e) {
    if (annCur && annCur.tool === 'eraser' && annCur.eraserBefore) {
      if (e) e.preventDefault();
      const before = annCur.eraserBefore, after = JSON.parse(JSON.stringify(annCur.ann));
      annCur.eraserBefore = null;
      if (JSON.stringify(before) !== JSON.stringify(after)) annPushAction({ type: 'replaceAnn', before, after });
      annDraw(); return;
    }
    if (annCur && annCur.tool === 'crop' && annCur.cropDrag) {
      if (e) e.preventDefault();
      const r = annCur.cropDrag;
      const dx = Math.abs(r.x2 - r.x1), dy = Math.abs(r.y2 - r.y1);
      if (dx > 0.03 && dy > 0.03) {
        annCur.cropRect = r;
        const btn = document.getElementById('annCropApply');
        if (btn) btn.disabled = false;
      }
      annCur.cropDrag = null;
      annDraw();
      return;
    }
    if (annCur && annMoveDrag && (annCur.tool === 'move' || annMoveDrag.textGesture)) {
      if (e) e.preventDefault();
      const { index, before } = annMoveDrag;
      const after = JSON.parse(JSON.stringify(annCur.ann[index]));
      // Kalau ternyata cuma diklik (tidak digeser sama sekali), jangan catat
      // sebagai aksi Undo -- supaya klik-klik ringan tidak memenuhi riwayat
      // dengan entri "geser" yang sebenarnya tidak mengubah apa pun.
      if (JSON.stringify(before) !== JSON.stringify(after)) {
        annPushAction({ type: 'editShape', index, before, after });
      }
      if (annMoveDrag.textGesture && annMoveDrag.moved) annLastTextTap = null;
      annMoveDrag = null;
      annDraw();
      return;
    }

    if (!annDrag) return;
    if (e) e.preventDefault();

    // Buang coretan yang terlalu kecil -- biasanya cuma salah klik,
    // bukan anotasi yang benar-benar diinginkan.
    const dx = Math.abs(annDrag.x2 - annDrag.x1);
    const dy = Math.abs(annDrag.y2 - annDrag.y1);
    const cukup = (annDrag.t === 'free') ? (annDrag.pts.length > 2) : (dx > 0.012 || dy > 0.012);

    if (cukup) {
      annCur.ann.push(annDrag);
      annPushAction({ type: 'shape', shape: annDrag });
    }
    annDrag = null;
    annDraw();
  }

  function annUndo() {
    if (!annCur || !annCur.undoStack.length) return;
    const act = annCur.undoStack.pop();
    annApplyUndo(act);
    annCur.redoStack.push(act);
    annDraw();
  }
  function annRedo() {
    if (!annCur || !annCur.redoStack.length) return;
    const act = annCur.redoStack.pop();
    annApplyRedo(act);
    annCur.undoStack.push(act);
    annDraw();
  }

  // ---------- RIWAYAT AKSI (UNDO/REDO TERPADU) ----------
  // Mencakup DUA jenis aksi dalam satu riwayat linear yang sama: menggambar/
  // menghapus coretan (shape, clearAll) dan memotong foto (crop). Dengan ini,
  // urutan "Batalkan" selalu mengikuti urutan aksi yang benar-benar dilakukan
  // user -- termasuk saat crop dilakukan di tengah-tengah sesi menggambar.
  function annPushAction(action) {
    if (!annCur) return;
    annCur.undoStack.push(action);
    annCur.redoStack = [];
  }
  function annApplyUndo(act) {
    if (act.type === 'shape') {
      annCur.ann.pop();
    } else if (act.type === 'clearAll') {
      annCur.ann = act.prevAnn.map(a => Object.assign({}, a));
    } else if (act.type === 'replaceAnn') {
      annCur.ann = JSON.parse(JSON.stringify(act.before));
    } else if (act.type === 'crop') {
      annRestoreCropState(act.before);
    } else if (act.type === 'editShape') {
      annCur.ann[act.index] = Object.assign({}, act.before);
    } else if (act.type === 'removeShape') {
      annCur.ann.splice(act.index, 0, act.shape);
    }
  }
  function annApplyRedo(act) {
    if (act.type === 'shape') {
      annCur.ann.push(Object.assign({}, act.shape));
    } else if (act.type === 'clearAll') {
      annCur.ann = [];
    } else if (act.type === 'replaceAnn') {
      annCur.ann = JSON.parse(JSON.stringify(act.after));
    } else if (act.type === 'crop') {
      annRestoreCropState(act.after);
    } else if (act.type === 'editShape') {
      annCur.ann[act.index] = Object.assign({}, act.after);
    } else if (act.type === 'removeShape') {
      annCur.ann.splice(act.index, 1);
    }
  }
  // Kembalikan kanvas ke sebuah "snapshot" hasil crop (dipakai untuk undo
  // maupun redo aksi crop) -- termasuk mengatur ulang ukuran kanvas & skala
  // "fit" karena dimensi fotonya ikut berubah.
  function annRestoreCropState(state) {
    annCur.img = state.img;
    annCur.W = state.W;
    annCur.H = state.H;
    annCur.ann = state.ann.map(a => Object.assign({}, a));
    annCur.cropApplied = state.cropApplied;
    const cv = document.getElementById('annCanvas');
    cv.width = state.W; cv.height = state.H;
    const stage = document.querySelector('.ann-stage');
    const maxW = stage.clientWidth - 32;
    const maxH = stage.clientHeight - 32;
    const sc = Math.min(maxW / state.W, maxH / state.H, 1);
    annCur.fitZoom = sc;
    annCur.zoom = sc;
    annApplyZoom();
    const btn = document.getElementById('annCropApply');
    if (btn) btn.disabled = true;
  }

  function annClear() {
    if (!annCur || !annCur.ann.length) return;
    if (!confirm(`Hapus semua ${annCur.ann.length} anotasi di foto ini?`)) return;
    annPushAction({ type: 'clearAll', prevAnn: annCur.ann.map(a => Object.assign({}, a)) });
    annCur.ann = [];
    annDraw();
  }

  function annCancel() {
    // Perubahan dibuang begitu saja: annCur.ann tadi cuma salinan,
    // storeData belum pernah disentuh -- termasuk hasil crop yang belum disimpan
    // dan kotak teks yang masih terbuka (sengaja TIDAK di-commit di sini).
    annTextDiscard();
    annCur = null; annDrag = null; annMoveDrag = null;
    document.getElementById('annModal').classList.remove('active');
    document.body.style.overflow = '';
    document.querySelector('.ann-stage').classList.remove('zoomed');
  }

  function annSave() {
    if (!annCur) return;
    annTextCommitIfOpen();  // kotak teks yang masih terbuka ikut tersimpan
    const { id, side, ann, cropApplied, stamp, rot } = annCur;
    if (storeData[id]) {
      if (cropApplied) {
        // Foto sudah dipotong selama sesi ini -- "bakar" hasil crop (yang sudah
        // termasuk rotasi saat modal dibuka) jadi sumber baru, lalu reset sudut
        // rotasi ke 0 karena gambar ini sudah berada dalam orientasi tampilnya.
        const c = document.createElement('canvas');
        c.width = annCur.W; c.height = annCur.H;
        c.getContext('2d').drawImage(annCur.img, 0, 0);
        const out = canvasToOptimized(c);
        storeData[id][side + 'Orig'] = out.base64;
        storeData[id][side + 'Rot'] = 0;
      }
      storeData[id][side + 'Ann'] = ann;
      storeData[id][side + 'Stamp'] = stamp && Object.keys(stamp).some(key => key !== 'enabled' && stamp[key])
        ? Object.assign({}, stamp)
        : null;
      if (!cropApplied) storeData[id][side + 'Rot'] = rot;
      renderComposite(id, side);
    }
    const n = ann.length;
    annCur = null; annDrag = null; annMoveDrag = null;
    document.getElementById('annModal').classList.remove('active');
    document.body.style.overflow = '';
    document.querySelector('.ann-stage').classList.remove('zoomed');
    scheduleSave();
    showToast('success', 'Anotasi disimpan',
      (cropApplied ? 'Foto sudah dipotong. ' : '') +
      (n === 0 ? 'Semua anotasi dihapus dari foto ini.' : `${n} anotasi ditempel ke foto.`), 3000);
  }

  // Pasang listener kanvas sekali saja saat halaman dimuat
  (function initAnnCanvas() {
    const cv = document.getElementById('annCanvas');
    cv.addEventListener('pointerdown', annStart);
    cv.addEventListener('pointermove', annMove);
    window.addEventListener('pointerup', annEnd);
    window.addEventListener('pointercancel', annEnd);

    // Ctrl/Cmd + scroll untuk zoom -- scroll biasa tetap dipakai untuk
    // menggulir (pan) saat foto sedang diperbesar melebihi layar.
    document.querySelector('.ann-stage').addEventListener('wheel', e => {
      if (!annCur || !(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();
      annZoomTo(annCur.zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
    }, { passive: false });

    document.addEventListener('keydown', e => {
      if (!annCur) return;
      if (e.target && (e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) return;
      if (annCur.textEditing) {
        // Selagi mengetik, semua pintasan di bawah ini TIDAK boleh dibajak --
        // Ctrl+Z harus tetap jadi undo-ketik bawaan browser, tombol +/- harus
        // tetap bisa diketik sebagai karakter biasa. Cuma Escape yang dipakai,
        // untuk menutup kotak teksnya saja (bukan seluruh modal anotasi).
        if (e.key === 'Escape') { e.preventDefault(); annTextDiscard(); }
        return;
      }
      if (e.key === 'Escape') { annCancel(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); annUndo(); }
